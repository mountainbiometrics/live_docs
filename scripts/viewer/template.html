function wireReaderTree(treeEl) {
  if (treeEl._wired) return;
  treeEl._wired = true;
  treeEl.addEventListener("click", e => {
    const leaf = e.target.closest(".leaf[data-id]");
    if (leaf) location.hash = "#/" + leaf.getAttribute("data-id");
  });
  treeEl.addEventListener("dblclick", e => {
    const sum = e.target.closest("summary[data-ref]");
    if (!sum) return;
    e.preventDefault();
    location.hash = "#/" + sum.getAttribute("data-ref");
  });
}

// Open belongs_to ancestors so the focused row is visible; does not collapse
// anything the user left open elsewhere in the tree.
function revealInTree(treeEl, focusId) {
  const seen = new Set();
  let cur = String(focusId);
  while (cur && !seen.has(cur)) {
    seen.add(cur);
    const ps = parentsOf(cur).filter(p => byId.has(p));
    ps.forEach(p => {
      const sum = treeEl.querySelector(`summary[data-ref="${p}"]`);
      if (sum && sum.parentElement && sum.parentElement.tagName === "DETAILS") {
        sum.parentElement.open = true;
      }
    });
    cur = ps[0] || null;
  }
  const row = treeEl.querySelector(`.leaf[data-id="${focusId}"]`)
    || treeEl.querySelector(`summary[data-ref="${focusId}"]`);
  const details = row && row.closest("details");
  if (details) details.open = true;
}

function setTreeFocus(treeEl, focusId) {
  treeEl.querySelectorAll(".leaf").forEach(n =>
    n.classList.toggle("active", n.getAttribute("data-id") === focusId));
  treeEl.querySelectorAll("summary[data-ref]").forEach(s =>
    s.classList.toggle("active", s.getAttribute("data-ref") === focusId));
  if (focusId) {
    revealInTree(treeEl, focusId);
    const active = treeEl.querySelector(".leaf.active") || treeEl.querySelector("summary.active");
    if (active) active.scrollIntoView({ block: "nearest" });
  }
}

function ensureReaderShell() {
  const el = document.getElementById("page-reader");
  if (readerShell) return el.querySelector("#reader-content");
  if (readerTreeHtml === null) readerTreeHtml = buildTree();
  el.innerHTML = `<div class="reader"><div class="tree-panel">`
    + `<div class="tree-toolbar">`
    + `<button type="button" class="tree-act" data-tree-act="expand">Expand all</button>`
    + `<button type="button" class="tree-act" data-tree-act="collapse">Collapse all</button>`
    + `</div><div class="tree">${readerTreeHtml}</div></div>`
    + `<div class="content" id="reader-content"></div>`
    + `<aside class="graph-panel" id="reader-graph-panel" hidden>`
    + `<div class="graph-body" id="reader-graph"></div></aside></div>`;
  readerShell = el.querySelector(".reader");
  const treeEl = readerShell.querySelector(".tree");
  wireTreeToolbar(readerShell.querySelector(".tree-toolbar"), treeEl);
  wireReaderTree(treeEl);
  return el.querySelector("#reader-content");
}

function renderReader(focusId) {
  const content = ensureReaderShell();
  const treeEl = readerShell.querySelector(".tree");

  if (!focusId) {
    treeEl.querySelectorAll(".leaf.active, summary.active").forEach(n => n.classList.remove("active"));
    content.innerHTML = `<h1 class="doctitle">Reader</h1><div class="sub">Pick a doc from the tree on the left, or double-click any link anywhere to focus it here.</div>`;
    hideReaderGraph();
    return;
  }
  setTreeFocus(treeEl, focusId);
  renderFocusDoc(content, focusId);
}

function metaLine(d) {
  const bits = [];
  if (d.type) bits.push(enumDisplay("type", d.type));
  if (d.status) bits.push(`<span class="pill ${d.status}">${enumDisplay("status", d.status)}</span>`);
  if (d.level) bits.push("level: " + enumDisplay("level", d.level));
  if (d.created) bits.push("created " + String(d.created).slice(0, 10));
  bits.push(idBadge(d.id, { title: 1 }));
  let line = bits.join(" · ");
  const fp = facetDisplay(d.id, { title: 1 });
  if (fp) line += ` · <span class="scope-wrap">${fp}</span>`;
  return line;
}

function relGroup(title, ids) {
  if (!ids || !ids.length) return "";
  const sorted = ids.filter(id => byId.has(String(id))).slice().sort(compareIdsByTypeThenLabel);
  if (!sorted.length) return "";
  return `<div class="relgroup"><div class="rt">${escapeHtml(title)} (${sorted.length})</div><ul>` +
    sorted.map(id => `<li>${linkHtml(id, null, {icon:1})} ${edgeBadge(id)}</li>`).join("") + `</ul></div>`;
}

// Index member list, derived from the belongs_to reverse edge (children map) —
// the VIEWER is now the single source of this list; index bodies no longer carry
// a hand-written "## Map". Each member is a resolved label-link (hover tooltip),
// its one-line summary, a type pill, and an edge-count affordance.
function memberListHtml(indexId) {
  const members = (children.get(String(indexId)) || []).filter(mid => !isArchived(byId.get(mid)));
  if (!members.length) {
    return `<div class="members"><h2>Members</h2><div class="sub">No docs belong to this index yet.</div></div>`;
  }
  const sorted = members.slice().sort(compareIdsByTypeThenLabel);
  const li = sorted.map(mid => {
    const md = byId.get(mid);
    if (!md) return `<li>${linkHtml(mid)}</li>`;
    const sum = md.summary ? `<span class="msum">— ${escapeHtml(md.summary)}</span>` : "";
    return `<li>${linkHtml(mid, null, {icon:1})} ${facetDisplay(mid)} ${edgeBadge(mid)}${sum}</li>`;
  }).join("");
  return `<div class="members"><h2>Members (${members.length})</h2><ul>${li}</ul></div>`;
}

// The full two-column connections panel: OUTGOING (this doc's forward edges +
// derived children/required-by belong on the structural side) and INCOMING
// (everything that points back at this doc — the backlinks the user couldn't
// find). Every entry is a navigable resolved link with tooltip + edge badge.
function connectionsHtml(d, opts) {
  opts = opts || {};
  // outgoing: the forward edge fields, plus "children" (belongs_to-incoming) when
  // it's an index — but indexes render members separately, so skip children here.
  let out = "";
  out += relGroup("belongs to", edgeList(d, "belongs_to"));
  out += relGroup("requires", edgeList(d, "requires"));
  out += relGroup("relates", edgeList(d, "relates"));
  out += relGroup("provenance", edgeList(d, "provenance"));
  out += relGroup("superseded by", edgeList(d, "superseded_by"));
  if (!opts.skipChildren) out += relGroup("members (belongs_to →)", children.get(d.id));

  // incoming/backlinks: who points at this doc, grouped by edge type
  const inc = incomingOf(d.id);
  let back = "";
  back += relGroup("required by", inc.requires);
  back += relGroup("related from", inc.relates);
  back += relGroup("cited by (provenance)", inc.provenance);
  back += relGroup("supersedes", inc.superseded_by);
  // belongs_to-incoming = membership; only meaningful (and shown) for indexes,
  // where it's already the member list — so we omit it from backlinks to avoid dupes.

  const hasOut = out.trim(), hasBack = back.trim();
  if (!hasOut && !hasBack) return `<div class="rels"><h2>Connections</h2><div class="sub">No edges in or out.</div></div>`;
  return `<div class="rels"><h2>Connections</h2><div class="relcols">`
    + `<div class="relcol outgoing"><h3>Outgoing →</h3>${hasOut || '<div class="sub">none</div>'}</div>`
    + `<div class="relcol incoming"><h3>← Incoming (backlinks)</h3>${hasBack || '<div class="sub">none</div>'}</div>`
    + `</div></div>`;
}

// compact, collapsed-by-default change-trail for a doc
function historyTimeline(d) {
  const h = Array.isArray(d.history) ? d.history : [];
  if (!h.length) return "";
  const items = h.slice().sort((a, b) => String(a.at || "").localeCompare(String(b.at || "")))
    .map(e => {
      const when = escapeHtml(String(e.at || "").slice(0, 10));
      const what = renderMarkdown(String(e.summary || ""), 3);
      return `<li><div class="when">${when}</div><div class="what">${what}</div></li>`;
    }).join("");
  return `<details class="timeline"><summary>History — ${h.length} change${h.length === 1 ? "" : "s"}</summary><ol>${items}</ol></details>`;
}

function renderFocusDoc(content, id) {
  const d = byId.get(String(id));
  if (!d) { content.innerHTML = `<div class="sub">No doc with id ${escapeHtml(id)}.</div>`; return; }

  let html = `<h1 class="doctitle">${typeIcon(d.type)}${escapeHtml(d.label || d.title || id)}</h1>`;
  html += `<div class="meta-line">${metaLine(d)}</div>`;
  if (d.summary) html += `<div class="doc-summary">${escapeHtml(d.summary)}</div>`;

  if (isSignpost(d.id)) {
    // A SIGNPOST (descendant-bearing doc) shows its own body as the orientation
    // guide, then the member list rendered by the VIEWER from belongs_to reverse
    // edges (NOT from a "## Map" in the body). The `index` type is retired —
    // signpost-ness is purely structural now.
    html += `<div class="md" id="index-guide">${renderMarkdown(d.body)}</div>`;
    html += memberListHtml(d.id);
    html += `<div class="compose-btn"><button class="act" id="composeBtn">Expand — inline all member docs</button></div>`;
    html += `<div id="composed"></div>`;
    // a signpost still has its own edges (it belongs_to a parent, may require/relate)
    html += connectionsHtml(d, { skipChildren: true });
    content.innerHTML = html;
    const members = (children.get(d.id) || []).filter(mid => !isArchived(byId.get(mid))).slice().sort(compareIdsByTypeThenLabel);
    document.getElementById("composeBtn").addEventListener("click", function () {
      const target = document.getElementById("composed");
      if (target.innerHTML) { target.innerHTML = ""; this.textContent = "Expand — inline all member docs"; return; }
      let m = "";
      members.forEach(mid => {
        const md = byId.get(mid);
        if (!md) return;
        m += `<div class="member-sec"><h2 class="mtitle">${linkHtml(mid, null, {icon:1})} ${facetDisplay(mid)} ${edgeBadge(mid)}</h2>`;
        m += `<div class="md">${renderMarkdown(md.body)}</div>`;
        m += connectionsHtml(md);   // backlinks/next-hops visible in compose too
        m += `</div>`;
      });
      target.innerHTML = m || `<div class="sub">No member docs.</div>`;
      this.textContent = "Collapse members";
    });
    // history only — graph lives in the side panel
    content.insertAdjacentHTML("beforeend", historyTimeline(d));
    showReaderGraph(d.id);
    return;
  }

  // leaf doc: body + connections panel (outgoing + incoming backlinks)
  html += `<div class="md">${renderMarkdown(d.body)}</div>`;
  html += connectionsHtml(d);
  html += historyTimeline(d);
  content.innerHTML = html;
  showReaderGraph(d.id);
}

/* ===== NEIGHBORHOOD GRAPH =====
   Edge-aware expansion: 1-hop = direct neighbors (no provenance, no archived).
   Optional 2-hop follows edge-type rules — ancestors climb, descendants descend,
   requires shows immediate scope (belongs_to parent), relates hops nowhere. */

const NODE_CAP = 40;
const graphPrefs = {};
GRAPH_EDGE_TYPES.forEach(t => graphPrefs[t.key] = { on: true, dist: t.dist, strength: t.strength });
const graphView = { depth: 2 };

function belongsToAncestors(id, generations) {
  const out = new Set();
  let frontier = [String(id)];
  const seen = new Set(frontier);
  for (let g = 0; g < generations; g++) {
    const next = [];
    frontier.forEach(nid => {
      parentsOf(nid).forEach(p => {
        if (!isGraphEligible(p) || seen.has(p)) return;
        seen.add(p); out.add(p); next.push(p);
      });
    });
    frontier = next;
  }
  return out;
}

function directChildren(id) {
  return (children.get(String(id)) || []).filter(cid => isGraphEligible(cid));
}

function oneHopEdges(focusId, depth) {
  depth = depth || 1;
  const includeSoft = depth >= 2;
  const out = [];
  const d = byId.get(String(focusId));
  if (!d) return out;
  edgeList(d, "belongs_to").forEach(o => {
    if (isGraphEligible(o)) out.push({ other: o, type: "belongs_to", role: "ancestor", source: focusId, target: o });
  });
  directChildren(focusId).forEach(o => {
    out.push({ other: o, type: "children", role: "descendant", source: focusId, target: o });
  });
  edgeList(d, "requires").forEach(o => {
    if (isGraphEligible(o)) out.push({ other: o, type: "requires", role: "requires", source: focusId, target: o });
  });
  (requiredBy.get(String(focusId)) || []).forEach(o => {
    if (isGraphEligible(o)) out.push({ other: o, type: "required_by", role: "required_by", source: o, target: focusId });
  });
  if (includeSoft) {
    edgeList(d, "relates").forEach(o => {
      if (isGraphEligible(o)) out.push({ other: o, type: "relates", role: "relates", source: focusId, target: o });
    });
    edgeList(d, "superseded_by").forEach(o => {
      if (isGraphEligible(o)) out.push({ other: o, type: "superseded_by", role: "superseded", source: focusId, target: o });
    });
    DOCS.forEach(s => {
      if (String(s.id) === String(focusId) || isArchived(s)) return;
      edgeList(s, "relates").forEach(o => {
        if (o === String(focusId) && isGraphEligible(s.id)) {
          out.push({ other: s.id, type: "relates", role: "relates", source: s.id, target: focusId });
        }
      });
      edgeList(s, "superseded_by").forEach(o => {
        if (o === String(focusId) && isGraphEligible(s.id)) {
          out.push({ other: s.id, type: "superseded_by", role: "superseded", source: s.id, target: focusId });
        }
      });
    });
  }
  return out;
}

function secondHopFrom(nodeId, via) {
  const extras = [];
  const role = via && via.role;
  if (role === "ancestor") {
    belongsToAncestors(nodeId, 2).forEach(a => extras.push({ id: a, via: { type: "belongs_to", role: "ancestor" } }));
  } else if (role === "descendant") {
    directChildren(nodeId).forEach(c => extras.push({ id: c, via: { type: "children", role: "descendant" } }));
  } else if (role === "requires" || role === "required_by") {
    parentsOf(nodeId).slice(0, 1).forEach(a => {
      if (isGraphEligible(a)) extras.push({ id: a, via: { type: "belongs_to", role: "scope" } });
    });
  }
  return extras;
}

function neighborhood(focus, depth) {
  depth = depth || 1;
  const focusId = String(focus);
  const dist = new Map();
  const viaMap = new Map();
  if (!isGraphEligible(focusId)) return { nodes: new Set(), edges: [], capped: false, dist };
  dist.set(focusId, 0);

  const oneHop = oneHopEdges(focusId, depth);
  oneHop.forEach(e => {
    if (!dist.has(e.other)) { dist.set(e.other, 1); viaMap.set(e.other, e); }
  });

  let capped = false;
  if (depth >= 2) {
    for (const [nid, hop] of [...dist.entries()]) {
      if (hop !== 1) continue;
      secondHopFrom(nid, viaMap.get(nid)).forEach(ex => {
        if (dist.size >= NODE_CAP) { capped = true; return; }
        if (!dist.has(ex.id)) { dist.set(ex.id, 2); viaMap.set(ex.id, ex.via); }
      });
    }
  }

  const nodes = new Set(dist.keys());
  const seen = new Set(), edges = [];
  nodes.forEach(nid => {
    oneHopEdges(nid, depth).forEach(e => {
      if (!nodes.has(e.other)) return;
      const k = e.source + "|" + e.target + "|" + e.type;
      const rk = e.target + "|" + e.source + "|" + e.type;
      if (seen.has(k) || seen.has(rk)) return;
      seen.add(k);
      edges.push({ source: String(e.source), target: String(e.target), type: e.type });
    });
    if (nid !== focusId) return;
    oneHop.forEach(e => {
      const k = e.source + "|" + e.target + "|" + e.type;
      if (seen.has(k)) return;
      seen.add(k);
      edges.push({ source: String(e.source), target: String(e.target), type: e.type });
    });
  });
  return { nodes, edges, capped, dist };
}

function graphPanelHtml() {
  const toggles = GRAPH_EDGE_TYPES.map(t =>
    `<span class="gtoggle${graphPrefs[t.key].on ? "" : " off"}" data-etype="${t.key}">`
    + `<span class="swatch" style="background:${t.color}"></span>${t.label}</span>`).join("");
  const tune = GRAPH_EDGE_TYPES.map(t =>
    `<tr><td><span class="swatch" style="background:${t.color};width:14px;height:3px;display:inline-block;border-radius:2px"></span> ${t.label}</td>`
    + `<td>dist <input type="range" min="40" max="220" value="${graphPrefs[t.key].dist}" data-tune="dist" data-etype="${t.key}"></td>`
    + `<td>pull <input type="range" min="5" max="100" value="${Math.round(graphPrefs[t.key].strength*100)}" data-tune="strength" data-etype="${t.key}"></td></tr>`).join("");
  const hop = `<span class="ghop">zoom `
    + `<label><input type="radio" name="ghop" value="1"${graphView.depth===1?" checked":""}> near</label>`
    + `<label><input type="radio" name="ghop" value="2"${graphView.depth===2?" checked":""}> wide</label></span>`;
  return `<div class="ngraph"><h3 class="gtitle">Neighborhood graph</h3><div class="gwrap">`
    + `<div class="gcap" data-cap hidden></div>`
    + `<div class="gcontrols">${hop}${toggles}</div>`
    + `<details class="gtune"><summary>force tuning</summary><table>${tune}</table></details>`
    + `<svg class="graph" data-graph></svg>`
    + `<div class="ghint">Drag nodes to rearrange · hover for summary</div>`
    + `</div></div>`;
}

// mount + run the sim inside the panel just rendered into `container`
function mountGraph(container, focusId) {
  const panel = container.querySelector(".ngraph");
  if (!panel) return;
  const svg = panel.querySelector("svg[data-graph]");
  const capEl = panel.querySelector("[data-cap]");
  let sim = null;

  function build() {
    const nb = neighborhood(focusId, graphView.depth);
    if (nb.capped) { capEl.hidden = false; capEl.textContent = `Capped at ${NODE_CAP} nodes — near neighborhood kept fully, wide neighborhood sampled.`; }
    else capEl.hidden = true;

    const W = svg.clientWidth || 600, H = 420;
    const ids = [...nb.nodes];
    // seed positions on a circle around center (focus at center). A deterministic
    // angular jitter breaks exact symmetry so springs have a gradient to follow
    // without us re-randomizing every run.
    const nodes = ids.map((id, i) => {
      const isF = String(id) === String(focusId);
      const ang = (i / Math.max(1, ids.length)) * Math.PI * 2;
      const r = isF ? 0 : 120 + (nb.dist.get(id) === 2 ? 90 : 0);
      return { id, x: W/2 + Math.cos(ang)*r, y: H/2 + Math.sin(ang)*r + (isF?0:0.5), vx: 0, vy: 0, focus: isF, hop: nb.dist.get(id) };
    });
    const nmap = new Map(nodes.map(n => [n.id, n]));
    const edges = nb.edges.map(e => ({ ...e, s: nmap.get(e.source), t: nmap.get(e.target) }));
    return { W, H, nodes, edges, nmap };
  }

  let G = build();

  function activeEdges() { return G.edges.filter(e => graphPrefs[e.type] && graphPrefs[e.type].on && e.s && e.t); }

  function visibleNodes() {
    const focus = String(focusId);
    const edges = activeEdges();
    const adj = new Map();
    edges.forEach(e => {
      const a = String(e.source), b = String(e.target);
      if (!adj.has(a)) adj.set(a, []);
      if (!adj.has(b)) adj.set(b, []);
      adj.get(a).push(b);
      adj.get(b).push(a);
    });
    const seen = new Set([focus]);
    const stack = [focus];
    while (stack.length) {
      const n = stack.pop();
      (adj.get(n) || []).forEach(nb => {
        if (!seen.has(nb)) { seen.add(nb); stack.push(nb); }
      });
    }
    return seen;
  }

  // ---- simulated-annealing cooling ----
  // alpha is a global temperature in [0,1] that scales every displacement and
  // decays geometrically toward alphaMin. When it bottoms out the loop stops, so
  // motion smoothly damps to zero rather than oscillating forever. Repulsion and
  // spring constants are softened from the old values to avoid the "electrocuted"
  // thrash; clamped per-tick velocity prevents far-apart nodes from exploding.
  let alpha = 1;
  const alphaMin = 0.02, alphaDecay = 0.04, velMax = 8;
  const REPULSE = 1500;     // was 2600 — softer so the cloud doesn't blow apart
  const SPRING = 0.22;      // was 0.5 — gentler pull so it eases in, not snaps

  // one annealed force tick; returns mean displacement (for an optional settle check)
  function tick() {
    const { W, H, nodes } = G;
    const cx = W/2, cy = H/2;
    // mild centering (scaled by alpha)
    for (const n of nodes) {
      if (n.fixed || n.dragging) continue;
      n.vx += (cx - n.x) * 0.0016 * alpha;
      n.vy += (cy - n.y) * 0.0016 * alpha;
    }
    // pairwise repulsion (softened, alpha-scaled, with a min-distance floor)
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx*dx + dy*dy;
        if (d2 < 1) d2 = 1;
        const f = (REPULSE / d2) * alpha;
        const d = Math.sqrt(d2);
        const ux = dx/d, uy = dy/d;
        if (!a.fixed && !a.dragging) { a.vx += ux*f; a.vy += uy*f; }
        if (!b.fixed && !b.dragging) { b.vx -= ux*f; b.vy -= uy*f; }
      }
    }
    // springs along active edges, per-type distance/strength (alpha-scaled)
    for (const e of activeEdges()) {
      const p = graphPrefs[e.type];
      const a = e.s, b = e.t;
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 0.01;
      const diff = (d - p.dist) / d * p.strength * SPRING * alpha;
      const ox = dx*diff, oy = dy*diff;
      if (!a.fixed && !a.dragging) { a.vx += ox; a.vy += oy; }
      if (!b.fixed && !b.dragging) { b.vx -= ox; b.vy -= oy; }
    }
    // focus node anchored to center
    const fn = G.nodes.find(n => n.focus);
    if (fn && !fn.dragging) { fn.x = cx; fn.y = cy; fn.vx = fn.vy = 0; }
    let disp = 0;
    for (const n of nodes) {
      if (n.fixed || n.dragging || n.focus) continue;
      n.vx *= 0.75; n.vy *= 0.75;                 // stronger friction = calmer
      // clamp per-tick step so nothing whips across the canvas
      let mv = Math.sqrt(n.vx*n.vx + n.vy*n.vy);
      if (mv > velMax) { n.vx *= velMax/mv; n.vy *= velMax/mv; }
      n.x += n.vx; n.y += n.vy;
      n.x = Math.max(16, Math.min(W-16, n.x));
      n.y = Math.max(16, Math.min(H-16, n.y));
      disp += Math.abs(n.vx) + Math.abs(n.vy);
    }
    return disp / Math.max(1, nodes.length);
  }

  function draw() {
    const ns = "http://www.w3.org/2000/svg";
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const colorOf = {}; EDGE_TYPES.forEach(t => colorOf[t.key] = t.color);
    const ge = document.createElementNS(ns, "g");
    activeEdges().forEach(e => {
      const ln = document.createElementNS(ns, "line");
      ln.setAttribute("class", "gedge");
      ln.setAttribute("x1", e.s.x); ln.setAttribute("y1", e.s.y);
      ln.setAttribute("x2", e.t.x); ln.setAttribute("y2", e.t.y);
      ln.setAttribute("stroke", colorOf[e.type]);
      ln.setAttribute("stroke-width", e.type === "belongs_to" ? 2 : 1.4);
      if (e.type === "relates" || e.type === "provenance") ln.setAttribute("stroke-dasharray", "4 3");
      ge.appendChild(ln);
    });
    svg.appendChild(ge);
    const visible = visibleNodes();
    G.nodes.forEach(n => {
      if (!visible.has(String(n.id))) return;
      const d = byId.get(n.id);
      const g = document.createElementNS(ns, "g");
      g.setAttribute("class", "gnode" + (n.focus ? " focus" : ""));
      g.setAttribute("transform", `translate(${n.x},${n.y})`);
      g.setAttribute("data-nid", n.id);
      // node fill is now keyed by the doc's TYPE color (same palette as the type
      // icons), so the graph reads its taxonomy at a glance. Focus stays dark ink.
      const tdef = d ? (TYPE_ICONS[String(d.type)] || null) : null;
      const typeFill = tdef ? tdef.color : (isSignpost(n.id) ? "#5b6e8c" : "#a9b4c6");
      const domains = d ? ownDomains(d) : [];
      const domainStroke = domains.length ? domainColor(domains[0]).fg : null;
      const c = document.createElementNS(ns, "circle");
      c.setAttribute("r", n.focus ? 9 : (n.hop === 1 ? 6.5 : 5));
      c.setAttribute("fill", n.focus ? "#2b2b2b" : typeFill);
      if (domainStroke && !n.focus) {
        c.setAttribute("stroke", domainStroke);
        c.setAttribute("stroke-width", "2");
      }
      g.appendChild(c);
      // a tiny inline type glyph just LEFT of the node label, matching the rest of
      // the UI. Rendered as a nested SVG using the same Lucide path data.
      const tdefLbl = d && d.type ? (TYPE_ICONS[String(d.type)] || TYPE_ICON_FALLBACK) : null;
      const textX = (n.focus ? 12 : 9);
      if (tdefLbl) {
        const gi = document.createElementNS(ns, "g");
        // 11px box, baseline-aligned with the ~10.5px text (y=3.5)
        gi.setAttribute("transform", `translate(${textX},-5.5) scale(${11/24})`);
        gi.setAttribute("fill", "none");
        gi.setAttribute("stroke", tdefLbl.color);
        gi.setAttribute("stroke-width", "2.4");
        gi.setAttribute("stroke-linecap", "round");
        gi.setAttribute("stroke-linejoin", "round");
        gi.innerHTML = tdefLbl.svg;
        g.appendChild(gi);
      }
      const t = document.createElementNS(ns, "text");
      t.setAttribute("x", textX + (tdefLbl ? 14 : 0)); t.setAttribute("y", 3.5);
      let lbl = (d && (d.label || d.title || d.id)) || n.id;
      if (lbl.length > 26) lbl = lbl.slice(0, 25) + "…";
      t.textContent = lbl;
      g.appendChild(t);
      svg.appendChild(g);
    });
  }

  let raf = null;
  // animate: each frame ticks once, cools alpha, repaints; stops when cold so the
  // layout settles and STAYS settled (no perpetual jitter, no re-randomize).
  function loop() {
    tick();
    draw();
    alpha = Math.max(alphaMin, alpha - alpha * alphaDecay);
    if (alpha > alphaMin) raf = requestAnimationFrame(loop);
    else { raf = null; alpha = alphaMin; tick(); draw(); }  // one final cold settle
  }
  // Pre-warm: run a batch of iterations BEFORE the first paint so the panel opens
  // already roughly laid out, then the animated loop only gently settles it.
  function prewarm(iters) {
    const savedAlpha = alpha;
    alpha = 1;
    for (let i = 0; i < iters; i++) { tick(); alpha = Math.max(0.25, alpha - alpha * alphaDecay); }
    alpha = savedAlpha;
  }
  // Full (re)start: rebuild graph from scratch + reheat. Used only when the node
  // SET changes (depth toggle / panel first-open) — never on mere interaction.
  function start() {
    if (raf) cancelAnimationFrame(raf);
    G = build();
    prewarm(80);     // settle most of the way off-screen
    alpha = 0.45;    // open warm-ish, then ease the rest of the way down
    loop();
  }
  // Gentle reheat: keep current positions, just nudge the temperature back up so
  // the existing layout adapts to a toggle/tuning change without re-randomizing.
  function reheat(a) {
    alpha = Math.max(alpha, a || 0.3);
    if (!raf) loop();
  }

  // graph is always visible — start immediately
  start();
  panel.querySelectorAll('input[name="ghop"]').forEach(el => el.addEventListener("change", () => {
    graphView.depth = +el.value;
    start();
  }));
  // edge-type toggles — same node set, just reheat so it adapts smoothly
  panel.querySelectorAll(".gtoggle").forEach(el => el.addEventListener("click", () => {
    const k = el.getAttribute("data-etype");
    graphPrefs[k].on = !graphPrefs[k].on;
    el.classList.toggle("off", !graphPrefs[k].on);
    reheat(0.3);
  }));
  // force tuning sliders — reheat, don't rebuild
  panel.querySelectorAll("input[data-tune]").forEach(el => el.addEventListener("input", () => {
    const k = el.getAttribute("data-etype"), which = el.getAttribute("data-tune");
    if (which === "dist") graphPrefs[k].dist = +el.value;
    else graphPrefs[k].strength = +el.value / 100;
    reheat(0.25);
  }));

  // pointer: drag to move, click (no drag) to refocus, hover reuses tooltip
  let drag = null, moved = false;
  function svgPoint(ev) {
    const r = svg.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (G.W / r.width), y: (ev.clientY - r.top) * (G.H / r.height) };
  }
  svg.addEventListener("mousedown", ev => {
    const g = ev.target.closest(".gnode"); if (!g) return;
    const n = G.nmap.get(g.getAttribute("data-nid")); if (!n) return;
    drag = n; moved = false; n.dragging = true; svg.style.cursor = "grabbing";
    ev.preventDefault();
  });
  window.addEventListener("mousemove", ev => {
    if (!drag) return;
    const p = svgPoint(ev); drag.x = p.x; drag.y = p.y; drag.vx = drag.vy = 0; moved = true;
    // gently let neighbors relax around the dragged node — no rebuild, no re-seed
    reheat(0.18);
  });
  window.addEventListener("mouseup", () => {
    if (drag) { drag.dragging = false; drag = null; svg.style.cursor = "grab"; reheat(0.12); }
  });
  // tooltip reuse: synthesize a data-ref carrier on hover over a node
  svg.addEventListener("mousemove", ev => {
    const g = ev.target.closest(".gnode");
    if (g && !drag) { const fake = { getAttribute: a => a === "data-ref" ? g.getAttribute("data-nid") : null }; showTip(fake); moveTip(ev); }
    else if (!drag) hideTip();
  });
  svg.addEventListener("mouseleave", hideTip);
  // click = refocus (only if it wasn't a drag)
  svg.addEventListener("click", ev => {
    const g = ev.target.closest(".gnode"); if (!g || moved) return;
    hideTip();
    location.hash = "#/" + g.getAttribute("data-nid");
  });
}

/* ===== CATALOG ===== */
const catalogState = { type: "", status: "living", level: "", scope: "", domain: "", q: "", group: "", sort: "", dir: 1 };
let catalogFacetBound = false;
function applyCatalogFilter(field, value) {
  if (!(field in catalogState)) return;
  catalogState[field] = value;
  renderCatalog();
}
function renderCatalog() {
  const el = document.getElementById("page-catalog");
  const types = sortTypes([...new Set(DOCS.map(d => d.type).filter(Boolean))]);
  const statuses = [...new Set(DOCS.map(d => d.status).filter(Boolean))].sort();
  const levels = [...new Set(DOCS.map(d => d.level).filter(Boolean))].sort();
  const scopes = [...new Set(DOCS.flatMap(d => effectiveScopes(d.id)))].sort();
  const domains = [...new Set(DOCS.flatMap(d => ownDomains(d)))].sort();
  const optEnum = (arr, sel, field) => `<option value="">all</option>`
    + arr.map(v => `<option value="${escapeHtml(v)}" ${v===sel?"selected":""}>${escapeHtml(enumDisplay(field, v))}</option>`).join("");
  const optRaw = (arr, sel) => `<option value="">all</option>`
    + arr.map(v => `<option value="${escapeHtml(v)}" ${v===sel?"selected":""}>${escapeHtml(v)}</option>`).join("");

  let html = `<h1 class="pagetitle">Catalog</h1><div class="sub">Every doc as a row. Filter, group, and sort — click any facet chip to filter.</div>`;
  html += `<div class="catalog-tools">`;
  html += `<span class="preset" data-preset="decisions">Decisions</span>`;
  html += `<span class="preset" data-preset="principles">Principles</span>`;
  html += `<span class="preset" data-preset="living">Living</span>`;
  html += `<span class="preset" data-preset="clear">Clear</span>`;
  html += `&nbsp; type <select id="f-type">${optEnum(types, catalogState.type, "type")}</select>`;
  html += ` status <select id="f-status">${optEnum(statuses, catalogState.status, "status")}</select>`;
  html += ` level <select id="f-level">${optEnum(levels, catalogState.level, "level")}</select>`;
  if (scopes.length) html += ` scope <select id="f-scope">${optRaw(scopes, catalogState.scope)}</select>`;
  if (domains.length) html += ` domain <select id="f-domain">${optRaw(domains, catalogState.domain)}</select>`;
  html += ` group by <select id="f-group"><option value="">none</option>`
    + ["type","status","level"].concat(scopes.length ? ["scope"] : []).concat(domains.length ? ["domain"] : [])
        .map(g => `<option ${g===catalogState.group?"selected":""}>${g}</option>`).join("") + `</select>`;
  html += ` <input id="f-q" placeholder="search label/title/id…" value="${escapeHtml(catalogState.q)}">`;
  html += `</div>`;
  html += `<div class="count-note" id="cat-count"></div>`;
  html += `<table class="catalog"><thead><tr>`;
  const sortMark = c => catalogState.sort === c ? (catalogState.dir > 0 ? " ▲" : " ▼") : (catalogState.sort === "" && c === "type" ? " ▲" : "");
  html += `<th data-sort="created">created${sortMark("created")}</th>`;
  html += `<th data-sort="label">label${sortMark("label")}</th>`;
  html += `<th data-sort="id">id${sortMark("id")}</th>`;
  html += `<th data-sort="type">type${sortMark("type")}</th>`;
  html += `<th>scope</th><th>domain</th>`;
  html += `<th data-sort="level">level${sortMark("level")}</th>`;
  html += `<th data-sort="status">status${sortMark("status")}</th>`;
  html += `</tr></thead><tbody id="cat-body"></tbody></table>`;
  el.innerHTML = html;

  const draw = () => {
    let rows = DOCS.filter(d =>
      (!catalogState.type || d.type === catalogState.type) &&
      (!catalogState.status || d.status === catalogState.status) &&
      (!catalogState.level || d.level === catalogState.level) &&
      (!catalogState.scope || effectiveScopes(d.id).includes(catalogState.scope)) &&
      (!catalogState.domain || ownDomains(d).includes(catalogState.domain)) &&
      (!catalogState.q || ((d.label||"")+" "+(d.title||"")+" "+(d.id||"")).toLowerCase().includes(catalogState.q.toLowerCase())));
    const s = catalogState.sort;
    if (!s) {
      rows.sort((a, b) => compareDocsByTypeThenLabel(a, b) * catalogState.dir);
    } else if (s === "type") {
      rows.sort((a, b) => (compareDocsByTypeThenLabel(a, b)) * catalogState.dir);
    } else if (s === "label") {
      rows.sort((a, b) => docSortKey(a).localeCompare(docSortKey(b)) * catalogState.dir);
    } else if (s === "id") {
      rows.sort((a, b) => String(a.id).localeCompare(String(b.id)) * catalogState.dir);
    } else {
      rows.sort((a,b) => String(a[s]||"").localeCompare(String(b[s]||"")) * catalogState.dir);
    }
    document.getElementById("cat-count").textContent = `${rows.length} of ${DOCS.length} docs`;
    const body = document.getElementById("cat-body");
    const cell = d => `<td>${escapeHtml(String(d.created||"").slice(0,10))}</td>`
      + `<td>${linkHtml(d.id, null, {icon:1})}</td>`
      + `<td>${idBadge(d.id)}</td>`
      + `<td>${catEnumFacet("type", d.type)}</td>`
      + `<td>${scopeBreadcrumbs(d.id, { catalog: 1, title: 1 }) || '<span class="sub">—</span>'}</td>`
      + `<td>${domainTags(d.id, { catalog: 1, title: 1 }) || '<span class="sub">—</span>'}</td>`
      + `<td>${catEnumFacet("level", d.level)}</td>`
      + `<td>${catEnumFacet("status", d.status)}</td>`;
    if (catalogState.group) {
      const groups = {};
      const push = (k, d) => { (groups[k]=groups[k]||[]).push(d); };
      rows.forEach(d => {
        if (catalogState.group === "scope") {
          const es = effectiveScopes(d.id);
          if (!es.length) push("(none)", d); else es.forEach(z => push(z, d));
        } else if (catalogState.group === "domain") {
          const ds = ownDomains(d);
          if (!ds.length) push("(none)", d); else ds.forEach(z => push(z, d));
        } else push(d[catalogState.group]||"(none)", d);
      });
      body.innerHTML = sortGroupKeys(catalogState.group, Object.keys(groups)).map(k =>
        `<tr class="grouphdr"><td colspan="8">${escapeHtml(catalogState.group)}: ${escapeHtml(groupKeyLabel(catalogState.group, k))} (${groups[k].length})</td></tr>`
        + groups[k].map(d => `<tr>${cell(d)}</tr>`).join("")).join("");
    } else {
      body.innerHTML = rows.map(d => `<tr>${cell(d)}</tr>`).join("");
    }
  };

  el.querySelector("#f-type").addEventListener("change", e => { catalogState.type = e.target.value; draw(); });
  el.querySelector("#f-status").addEventListener("change", e => { catalogState.status = e.target.value; draw(); });
  el.querySelector("#f-level").addEventListener("change", e => { catalogState.level = e.target.value; draw(); });
  const scopeSel = el.querySelector("#f-scope");
  if (scopeSel) scopeSel.addEventListener("change", e => { catalogState.scope = e.target.value; draw(); });
  const domainSel = el.querySelector("#f-domain");
  if (domainSel) domainSel.addEventListener("change", e => { catalogState.domain = e.target.value; draw(); });
  el.querySelector("#f-group").addEventListener("change", e => { catalogState.group = e.target.value; draw(); });
  el.querySelector("#f-q").addEventListener("input", e => { catalogState.q = e.target.value; draw(); });
  el.querySelectorAll("th[data-sort]").forEach(th => th.addEventListener("click", () => {
    const c = th.getAttribute("data-sort");
    if (catalogState.sort === c) catalogState.dir *= -1; else { catalogState.sort = c; catalogState.dir = 1; }
    renderCatalog();
  }));
  el.querySelectorAll(".preset").forEach(p => p.addEventListener("click", () => {
    const k = p.getAttribute("data-preset");
    Object.assign(catalogState, { type: "", status: "living", level: "", scope: "", domain: "", q: "", group: "" });
    if (k === "decisions") catalogState.type = "decision";
    else if (k === "principles") catalogState.type = "principle";
    else if (k === "living") catalogState.status = "living";
    renderCatalog();
  }));
  if (!catalogFacetBound) {
    catalogFacetBound = true;
    el.addEventListener("click", e => {
      const btn = e.target.closest(".cat-facet");
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      applyCatalogFilter(btn.getAttribute("data-cf"), btn.getAttribute("data-cv"));
    });
  }
  draw();
}

/* ===== LEXICON =====
   Own view (not a Catalog tab): catalog-like table of ratified terms, with
   cheap usage stats and a detail pane for one term. */
const lexiconState = { q: "", context: "", sort: "term", dir: 1 };
function renderLexicon(focusId) {
  const el = document.getElementById("page-lexicon");
  if (!el) return;
  const terms = (LEXICON || []).slice();
  const contexts = [...new Set(terms.map(t => t.context).filter(Boolean))].sort();
  const q = (lexiconState.q || "").toLowerCase();
  let rows = terms.filter(t => {
    if (lexiconState.context && (t.context || "") !== lexiconState.context) return false;
    if (!q) return true;
    const blob = [t.id, t.term, t.display, t.definition, t.context,
      ...(t.allowed_aliases || []), ...(t.restricted_aliases || [])]
      .filter(Boolean).join(" ").toLowerCase();
    return blob.includes(q);
  });
  const dir = lexiconState.dir || 1;
  const sortKey = lexiconState.sort || "term";
  rows.sort((a, b) => {
    let av, bv;
    if (sortKey === "docs") {
      av = (a.stats && a.stats.docs) || 0;
      bv = (b.stats && b.stats.docs) || 0;
      return (av - bv) * dir;
    }
    av = String(a[sortKey] || a.display || a.id || "");
    bv = String(b[sortKey] || b.display || b.id || "");
    return av.localeCompare(bv) * dir;
  });

  let html = `<h1 class="pagetitle">Lexicon</h1>
    <div class="sub">Human-ratified vocabulary. Soft links — missing terms are invitations, not errors.</div>
    <div class="catalog-tools">
      <input id="lex-q" type="search" placeholder="filter terms…" value="${escapeHtml(lexiconState.q || "")}" style="min-width:200px">
      context <select id="lex-context"><option value="">(all)</option>${
        contexts.map(c => `<option ${c===lexiconState.context?"selected":""}>${escapeHtml(c)}</option>`).join("")
      }</select>
      <span class="sub" style="margin-left:8px">${rows.length} / ${terms.length}</span>
    </div>`;

  if (focusId) {
    const tid = decodeURIComponent(focusId);
    const t = byTermId.get(tid);
    if (t) {
      html += lexiconDetailHtml(t);
    } else {
      html += `<div class="card" style="margin:0 24px 16px;padding:14px 16px">
        <div class="tt-label">${escapeHtml(tid)}</div>
        <div class="sub">Undocumented term — soft link with no lexicon entry yet.</div>
      </div>`;
    }
  }

  html += `<table class="catalog"><thead><tr>
    <th data-lsort="display">Term</th>
    <th data-lsort="context">Context</th>
    <th>Definition</th>
    <th data-lsort="docs">Docs</th>
    <th>By type</th>
  </tr></thead><tbody>`;
  if (!rows.length) {
    html += `<tr><td colspan="5" class="sub">(no terms)</td></tr>`;
  } else {
    rows.forEach(t => {
      const n = (t.stats && t.stats.docs) || 0;
      const byType = t.stats && t.stats.by_type
        ? Object.entries(t.stats.by_type).map(([k, v]) => `${k}:${v}`).join(" · ")
        : "";
      html += `<tr>
        <td><a class="tl" data-term="${escapeHtml(t.id)}" href="#/term/${encodeURIComponent(t.id)}">${escapeHtml(t.display || t.term)}</a>
          <div class="sub" style="font-size:11px">${escapeHtml(t.id)}</div></td>
        <td>${t.context ? escapeHtml(t.context) : "<span class=sub>—</span>"}</td>
        <td class="lex-def">${renderInlineProse(t.definition || "")}</td>
        <td>${n}</td>
        <td class="sub">${escapeHtml(byType)}</td>
      </tr>`;
    });
  }
  html += `</tbody></table>`;
  el.innerHTML = html;

  const qEl = document.getElementById("lex-q");
  if (qEl) qEl.addEventListener("input", () => {
    lexiconState.q = qEl.value;
    renderLexicon(focusId);
  });
  const cEl = document.getElementById("lex-context");
  if (cEl) cEl.addEventListener("change", () => {
    lexiconState.context = cEl.value;
    renderLexicon(focusId);
  });
  el.querySelectorAll("th[data-lsort]").forEach(th => {
    th.style.cursor = "pointer";
    th.addEventListener("click", () => {
      const k = th.getAttribute("data-lsort");
      if (lexiconState.sort === k) lexiconState.dir *= -1;
      else { lexiconState.sort = k; lexiconState.dir = 1; }
      renderLexicon(focusId);
    });
  });
}

function lexiconDetailHtml(t) {
  const n = (t.stats && t.stats.docs) || 0;
  const fmtMap = (obj) => {
    const entries = Object.entries(obj || {});
    if (!entries.length) return "<span class=sub>—</span>";
    return entries.map(([k, v]) => `<code>${escapeHtml(k)}</code> ${v}`).join(" · ");
  };
  let aliases = "";
  if ((t.allowed_aliases || []).length) {
    aliases += `<div><strong>Allowed aliases:</strong> ${t.allowed_aliases.map(escapeHtml).join(", ")}</div>`;
  }
  if ((t.restricted_aliases || []).length) {
    aliases += `<div><strong>Restricted aliases:</strong> ${t.restricted_aliases.map(escapeHtml).join(", ")}</div>`;
  }
  if ((t.similar_terms || []).length) {
    aliases += `<div><strong>Similar:</strong> ${
      t.similar_terms.map(s => termLinkHtml(s)).join(", ")
    }</div>`;
  }
  return `<div class="card" style="margin:0 24px 16px;padding:14px 16px">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
      <div class="tt-label" style="font-size:18px">${escapeHtml(t.display || t.term)}</div>
      <a class="sub" href="#lexicon">← all terms</a>
    </div>
    <div class="sub" style="margin:4px 0 10px">${escapeHtml(t.id)}${t.context ? " · context " + escapeHtml(t.context) : " · ubiquitous"}</div>
    <div class="lex-def" style="margin-bottom:10px">${renderInlineProse(t.definition || "")}</div>
    ${aliases}
    <div style="margin-top:10px" class="sub">
      <strong>${n}</strong> doc${n===1?"":"s"} · by type: ${fmtMap(t.stats && t.stats.by_type)}
      · by domain: ${fmtMap(t.stats && t.stats.by_domain)}
      · by scope: ${fmtMap(t.stats && t.stats.by_scope)}
    </div>
  </div>`;
}

/* ===== REVIEWS =====
   Header (always visible): date/id/signoffs + two metric clusters (existing vs
   new) + session summary blurb. Expanded body: change sections only — the
   ## Summary block is stripped so it is not double-rendered. */
function signoffBadges(r) {
  const sigs = Array.isArray(r.signoffs) ? r.signoffs : [];
  if (!sigs.length) return `<span class="badge unsigned">unsigned</span>`;
  return sigs.map(s => {
    const who = escapeHtml(String(s.who || s.by || "signed").replace(/@.*$/, ""));
    const at = s.at ? `<span class="sig-at">${escapeHtml(String(s.at).slice(0,10))}</span>` : "";
    return `<span class="sig">${who} ${at}</span>`;
  }).join(" ");
}

function reviewMetric(num, unit, title) {
  const n = Number(num) || 0;
  const tip = title ? ` title="${escapeHtml(title)}"` : "";
  return `<span class="rev-metric"${tip}><span class="rev-gnum">${n}</span>`
    + (unit ? ` <span class="rev-gunit">${escapeHtml(unit)}</span>` : "")
    + `</span>`;
}

function reviewMetricsHtml(r) {
  const s = r.stats || {};
  const existingDocs = (s.touched_docs || 0) + (s.minor_docs || 0);
  const newDocs = s.new_docs || 0;
  const refDocs = s.reference_docs || 0;
  const hasInt = !!s.has_integration;
  const edgesOnExisting = s.edges_added_to_existing || 0;
  const outToExisting = s.new_to_existing || 0;
  const amongNew = s.new_to_new || 0;
  const fallbackTouched = (!existingDocs && !newDocs && !refDocs && (r.touched || []).length)
    ? (r.touched || []).length : 0;

  const groups = [];

  if (newDocs || (hasInt && (outToExisting || amongNew))) {
    const bits = [];
    bits.push(reviewMetric(newDocs, "docs", "New living docs added"));
    if (hasInt) {
      bits.push(`<span class="rev-gsep">·</span>`);
      bits.push(reviewMetric(outToExisting, "→", "Edges from new docs to existing docs"));
      bits.push(`<span class="rev-gsep">·</span>`);
      bits.push(reviewMetric(amongNew, "↔", "Edges among the new docs"));
    }
    groups.push(`<div class="rev-group"><span class="rev-glabel">New</span>${bits.join(" ")}</div>`);
  }

  if (existingDocs || (hasInt && edgesOnExisting) || fallbackTouched) {
    const bits = [];
    bits.push(reviewMetric(existingDocs || fallbackTouched, "docs", "Docs revised in this session"));
    if (hasInt) {
      bits.push(`<span class="rev-gsep">·</span>`);
      bits.push(reviewMetric(edgesOnExisting, "edges", "New edges added on existing docs"));
    }
    groups.push(`<div class="rev-group"><span class="rev-glabel">Revised</span>${bits.join(" ")}</div>`);
  }

  if (refDocs) {
    groups.push(`<div class="rev-group"><span class="rev-glabel">refs</span>${reviewMetric(refDocs, "", "Reference files (not counted as new docs)")}</div>`);
  }

  if (!groups.length) return "";
  return `<div class="rev-metrics">${groups.join("")}</div>`;
}

function stripReviewSummarySection(body) {
  // Drop the leading ## Summary block — it lives in the card header via stats.summary.
  if (!body) return "";
  const lines = String(body).split("\n");
  const out = [];
  let skipping = false;
  for (const line of lines) {
    if (/^##\s+Summary\b/i.test(line)) { skipping = true; continue; }
    if (skipping && /^##\s+/.test(line)) skipping = false;
    if (!skipping) out.push(line);
  }
  return out.join("\n").replace(/^\s+/, "").replace(/\s+$/, "");
}

function renderReviews() {
  const el = document.getElementById("page-reviews");
  const revs = REVIEWS.slice().sort((a,b) => String(b.id).localeCompare(String(a.id))); // newest first
  let html = `<h1 class="pagetitle">Reviews</h1><div class="sub">The review queue, newest first. Click a card to read the change sections; the sign-off command lives there. The viewer never writes — run the command in a terminal.</div>`;
  if (!revs.length) html += `<div class="sub" style="margin-left:24px">No reviews.</div>`;
  html += `<div style="margin:0 24px 40px">`;
  revs.forEach(r => {
    const signed = Array.isArray(r.signoffs) && r.signoffs.length > 0;
    const stats = r.stats || {};
    const cmd = `ldoc review sign ${r.id}`;
    const bodySansSummary = stripReviewSummarySection(r.body || "");
    html += `<div class="card rev-card ${signed?"signed":"unsigned"}" data-rid="${escapeHtml(String(r.id))}">`;
    html += `<div class="rev-head">`;
    html += `<div class="rev-top">`
      + `<span class="rev-toggle">▸</span>`
      + `<span class="rev-when">${escapeHtml(String(r.created||"").slice(0,10))} ${idBadge(r.id)}</span>`
      + `<span class="spacer"></span>`
      + `${signoffBadges(r)}</div>`;
    html += reviewMetricsHtml(r);
    if (stats.summary) {
      html += `<div class="rev-blurb">${escapeHtml(stats.summary)}</div>`;
    }
    html += `</div>`;
    html += `<div class="rev-body">`;
    html += bodySansSummary
      ? `<div class="md">${renderMarkdown(bodySansSummary)}</div>`
      : `<div class="sub">No change summary recorded.</div>`;
    html += `<div class="snippet" style="margin-top:14px"><code>${escapeHtml(cmd)}</code>`
      + `<button class="copybtn" data-cmd="${escapeHtml(cmd)}">copy sign-off command</button></div>`;
    html += `</div></div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
  el.querySelectorAll(".rev-head").forEach(h => h.addEventListener("click", () => {
    const card = h.closest(".rev-card");
    const open = card.classList.toggle("open");
    h.querySelector(".rev-toggle").textContent = open ? "▾" : "▸";
  }));
  el.querySelectorAll(".copybtn").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const cmd = b.getAttribute("data-cmd");
    navigator.clipboard?.writeText(cmd).then(() => { b.textContent = "copied!"; setTimeout(() => b.textContent = "copy sign-off command", 1200); })
      .catch(() => { b.textContent = "copy failed"; });
  }));
}

/* ===== type-icon legend (key) ===== */
// Build the collapsible key from the same TYPE_ICONS map the rest of the UI uses,
// so the legend can never drift from the rendered glyphs. Only types that actually
// occur in the store are shown, in TYPE_ORDER (high-level → concrete).
function renderTypeKey() {
  const present = new Set(DOCS.map(d => d.type).filter(Boolean));
  const panel = document.getElementById("typekey-panel");
  if (!panel) return;
  const typeKeys = sortTypes(Object.keys(TYPE_ICONS).filter(t => present.has(t)));
  const rows = typeKeys
    .map(t => `<div class="keyrow">${typeIcon(t, { title: false })}<span>${escapeHtml(titleCaseEnum(t))}</span></div>`)
    .join("");
  panel.innerHTML = rows || `<div class="keyrow sub">no typed docs</div>`;
}

/* ===== boot ===== */
applyViewerConfig();
applyViewerThemeOverrides();
renderTypeKey();
renderHome();
renderCatalog();
renderLexicon();
renderReviews();
route();
</script>
