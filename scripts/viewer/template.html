<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>live_docs</title>
<link rel="icon" id="favicon-link" href="data:,">
<style>
  :root {
    --bg: #f7f6f3;
    --panel: #ffffff;
    --ink: #2b2b2b;
    --muted: #777;
    --faint: #9a9a9a;
    --line: #e4e2dc;
    --accent: #5b6e8c;
    --accent-soft: #eef1f6;
    --link: #3f5e8f;
    --broken: #b03a3a;
    --tag-bg: #eceae4;
    --warn: #b07a2a;
    --warn-bg: #fbf3e2;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header.topnav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 4px;
    padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header.topnav .brand { font-weight: 700; margin-right: 18px; letter-spacing: .3px; }
  header.topnav .brand small { color: var(--faint); font-weight: 400; }
  nav button {
    background: none; border: 1px solid transparent; border-radius: 6px;
    padding: 5px 12px; font-size: 14px; color: var(--muted); cursor: pointer;
  }
  nav button:hover { background: var(--accent-soft); color: var(--ink); }
  nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { padding: 0; }
  .page { display: none; }
  .page.active { display: block; }

  /* generic */
  h1.pagetitle { font-size: 20px; margin: 22px 24px 6px; }
  .sub { color: var(--muted); margin: 0 24px 18px; font-size: 13px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .grid { display: grid; gap: 12px; }
  a.dl { color: var(--link); text-decoration: none; cursor: pointer; border-bottom: 1px dotted var(--link); }
  a.dl:hover { background: var(--accent-soft); }
  a.dl.broken { color: var(--broken); border-bottom-color: var(--broken); }
  a.dl.broken::after { content: " (broken)"; font-size: 11px; }
  a.tl { color: #6b5b3e; text-decoration: none; cursor: pointer; border-bottom: 1px dashed #6b5b3e55; }
  a.tl:hover { background: #f3efe6; }
  a.tl.broken { color: var(--broken); border-bottom-color: var(--broken); }
  a.tl.broken::after { content: " (?)"; font-size: 11px; }
  .pill {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
    background: var(--tag-bg); color: var(--muted); margin-left: 4px; vertical-align: middle;
  }
  .pill.deprecated { background: #f3e0e0; color: var(--broken); }
  .pill.target { background: var(--warn-bg); color: var(--warn); }
  .pill.reference { background: #e4ecf3; color: var(--accent); }

  /* type icon — a small inline Lucide glyph rendered immediately BEFORE a label.
     Conveys the doc's `type` (replacing the old trailing type pill). Sized to the
     surrounding text, vertically centered, with a subtle per-type color set inline. */
  .ticon {
    display: inline-block; width: 1em; height: 1em; vertical-align: -0.13em;
    margin-right: 0.35em; flex: none;
  }
  .ticon svg { width: 100%; height: 100%; display: block; }
  /* in the dark tooltip the per-type ink can go too dim — lift it a touch */
  #tooltip .ticon { opacity: .95; }
  /* type legend (collapsible key, unobtrusive in the top nav) */
  details.typekey { position: relative; margin-left: 6px; }
  details.typekey > summary {
    list-style: none; cursor: pointer; font-size: 13px; color: var(--muted);
    border: 1px solid transparent; border-radius: 6px; padding: 5px 10px;
  }
  details.typekey > summary::-webkit-details-marker { display: none; }
  details.typekey > summary:hover { background: var(--accent-soft); color: var(--ink); }
  details.typekey[open] > summary { background: var(--accent-soft); color: var(--accent); }
  details.typekey .keypanel {
    position: absolute; right: 0; top: 100%; margin-top: 6px; z-index: 60;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 8px 10px; min-width: 180px;
  }
  details.typekey .keyrow { display: flex; align-items: center; padding: 3px 2px; font-size: 13px; }
  details.typekey .keyrow .ticon { margin-right: 8px; }
  /* scope breadcrumbs + domain facet pills */
  .scopecrumbs {
    display: inline-flex; align-items: center; flex-wrap: wrap;
    font-size: 11px; font-weight: 500; vertical-align: middle; margin-left: 4px;
  }
  .scopecrumbs .sep { color: var(--faint); margin: 0 1px; user-select: none; }
  .scopecrumbs .crumb { color: var(--muted); }
  .domainpill {
    display: inline-block; font-size: 10.5px; line-height: 1.5; padding: 0 7px;
    border-radius: 10px; border: 1px solid transparent; margin-left: 4px;
    vertical-align: middle; font-weight: 600; letter-spacing: .2px;
  }
  #tooltip .domainpill { border-color: transparent; }
  .meta-line .scopecrumbs { margin-left: 0; margin-right: 2px; }
  .meta-line .domainpill { margin-left: 0; margin-right: 2px; }
  /* catalog facet chips — clickable but not link-styled */
  button.cat-facet {
    background: none; border: none; margin: 0; font: inherit;
    color: inherit; cursor: pointer; padding: 0;
    border-radius: 4px;
  }
  button.cat-facet:hover { background: var(--accent-soft); }
  table.catalog .scopecrumbs { margin-left: 0; font-size: 11px; }
  table.catalog .scopecrumbs button.cat-facet.crumb {
    color: var(--muted); font-size: 11px; font-weight: 500; padding: 1px 3px;
  }
  table.catalog button.cat-facet.facet-plain {
    font-size: 13px; color: var(--ink); padding: 1px 4px;
  }
  table.catalog button.cat-facet.domainpill,
  button.cat-facet.domainpill {
    display: inline-block; font-size: 10.5px; line-height: 1.5;
    padding: 0 7px; border-radius: 10px; border: 1px solid transparent;
    margin-right: 2px; vertical-align: middle; font-weight: 600; letter-spacing: .2px;
  }
  table.catalog button.cat-facet.pill,
  button.cat-facet.pill {
    display: inline-block; font-size: 11px; line-height: 1.5;
    padding: 1px 7px; border-radius: 10px; border: none; vertical-align: middle;
  }
  button.cat-facet.pill.deprecated { background: #f3e0e0; color: var(--broken); }
  button.cat-facet.pill.target { background: var(--warn-bg); color: var(--warn); }
  button.cat-facet.pill.reference { background: #e4ecf3; color: var(--accent); }
  button.cat-facet.pill.living { background: var(--tag-bg); color: var(--muted); }

  /* dashboard */
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 24px 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; min-width: 110px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .dash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 0 24px 24px; }
  .dash-cols h3 { font-size: 14px; margin: 0 0 8px; color: var(--accent); }
  @media (max-width: 820px) { .dash-cols { grid-template-columns: 1fr; } }
  ul.tight { margin: 0; padding-left: 0; list-style: none; }
  ul.tight li { padding: 4px 0; border-bottom: 1px solid var(--line); }
  ul.tight li:last-child { border-bottom: none; }

  /* reader */
  .reader { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 49px); }
  .reader.has-graph { grid-template-columns: 290px 1fr min(380px, 34vw); }
  .tree-panel {
    display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 49px; max-height: calc(100vh - 49px);
  }
  .tree-toolbar {
    display: flex; gap: 6px; padding: 8px 8px 6px;
    border-bottom: 1px solid var(--line); flex: none;
  }
  .tree-toolbar button.tree-act {
    background: var(--accent-soft); color: var(--accent); border: none;
    border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer;
  }
  .tree-toolbar button.tree-act:hover { opacity: .85; }
  .tree { padding: 8px 8px 12px; overflow-y: auto; flex: 1; min-height: 0; }
  .tree .tree-node { margin-bottom: 1px; }
  .tree summary,
  .tree .leaf {
    padding: 3px 6px;
    border-radius: 5px; font-size: 13px;
  }
  .tree summary {
    cursor: pointer; font-weight: 600; color: var(--accent); list-style: none;
    display: flex; align-items: center;
  }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary::before {
    content: ""; display: inline-block; flex: none;
    width: 0; height: 0; margin-right: 6px;
    border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    border-left: 5px solid var(--faint);
    transition: transform .12s;
  }
  .tree details[open] > summary::before { transform: rotate(90deg); }
  .tree summary:hover { background: var(--accent-soft); }
  .tree summary.active { background: var(--accent-soft); }
  .tree .tree-children {
    border-left: 1px solid var(--line);
    margin-left: 6px;
    padding-left: 2px;
  }
  .tree .tree-count { font-weight: 400; font-size: 11px; color: var(--faint); margin-left: 4px; }
  .tree .leaf { cursor: pointer; color: var(--ink); font-weight: 400; }
  .tree .leaf:hover { background: var(--accent-soft); }
  .tree .leaf.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .content { padding: 22px 28px; max-width: 820px; overflow-x: hidden; min-width: 0; }
  .graph-panel {
    display: flex; flex-direction: column;
    border-left: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 49px; max-height: calc(100vh - 49px);
    min-width: 0; overflow: hidden;
  }
  .graph-panel[hidden] { display: none !important; }
  .graph-panel .graph-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .graph-panel .ngraph { margin: 0; border: none; border-radius: 0; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .graph-panel .gwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; padding-bottom: 8px; }
  .graph-panel svg.graph { flex: 1; min-height: 200px; height: auto; max-height: none; }
  .content h1.doctitle { font-size: 22px; margin: 0 0 2px; }
  .meta-line { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .docid { font-family: var(--mono); font-size: 11.5px; color: var(--faint); font-weight: 400; }
  .meta-line .docid, #tooltip .docid { font-size: 11px; }
  .doc-summary { color: var(--muted); font-style: italic; border-left: 3px solid var(--line); padding-left: 12px; margin: 0 0 18px; }
  .md { line-height: 1.6; }
  .md h2 { font-size: 17px; margin: 22px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .md h3 { font-size: 15px; margin: 18px 0 6px; }
  .md code { background: var(--tag-bg); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }
  .md pre { background: #2b2b2b; color: #f0f0f0; padding: 12px; border-radius: 8px; overflow-x: auto; }
  .md pre code { background: none; color: inherit; padding: 0; }
  .md blockquote { border-left: 3px solid var(--line); margin: 0; padding-left: 12px; color: var(--muted); }
  .md table { border-collapse: collapse; }
  .md td, .md th { border: 1px solid var(--line); padding: 4px 8px; }

  /* inline expand (accordion) */
  .expand { margin: 6px 0 6px 0; border-left: 3px solid var(--accent-soft); background: #fafaf8; border-radius: 0 6px 6px 0; padding: 8px 12px; }
  .expand .eh { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
  .transclude { border: 1px dashed var(--line); border-radius: 6px; padding: 8px 12px; margin: 8px 0; background: #fafaf8; }
  .transclude .th { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }

  /* neighborhood graph — always visible */
  .ngraph { margin-top: 22px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .ngraph .gtitle { font-size: 15px; font-weight: 600; padding: 12px 16px 0; margin: 0; }
  .ngraph .gwrap { padding: 0 12px 12px; }
  .gcontrols { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 0 4px 8px; font-size: 12px; }
  .gtoggle { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; padding: 2px 8px; border: 1px solid var(--line); border-radius: 12px; user-select: none; }
  .gtoggle.off { opacity: .4; }
  .ghop { display: inline-flex; align-items: center; gap: 8px; padding: 2px 10px 2px 8px; margin-right: 4px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  .ghop label { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
  .ghop input { margin: 0; }
  .gtoggle .swatch { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
  .gcap { color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 4px 10px; font-size: 12px; margin: 0 4px 8px; }
  .gtune { margin: 0 4px 8px; }
  .gtune summary { cursor: pointer; color: var(--accent); font-size: 12px; list-style: none; }
  .gtune summary::-webkit-details-marker { display: none; }
  .gtune table { border-collapse: collapse; margin-top: 6px; font-size: 11.5px; }
  .gtune td { padding: 2px 8px; }
  .gtune input[type=range] { width: 90px; vertical-align: middle; }
  svg.graph { width: 100%; height: 420px; display: block; background: #fcfbf9; border: 1px solid var(--line); border-radius: 6px; cursor: grab; }
  svg.graph .gedge { stroke-opacity: .55; }
  svg.graph .gnode { cursor: pointer; }
  svg.graph .gnode circle { stroke: #fff; stroke-width: 1.5; }
  svg.graph .gnode.focus circle { stroke: var(--ink); stroke-width: 2.5; }
  svg.graph .gnode text { font-size: 10.5px; fill: var(--ink); paint-order: stroke; stroke: #fcfbf9; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
  .ghint { color: var(--faint); font-size: 11.5px; margin: 6px 4px 0; }

  /* relationships panel */
  .rels { margin-top: 28px; border-top: 2px solid var(--line); padding-top: 14px; }
  .rels h2 { font-size: 15px; margin: 0 0 10px; }
  .rels .relcols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 700px) { .rels .relcols { grid-template-columns: 1fr; } }
  .rels .relcol > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); margin: 0 0 6px; }
  .rels .relcol.incoming > h3 { color: var(--warn); }
  .relgroup { margin-bottom: 10px; }
  .relgroup .rt { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin-bottom: 3px; }
  .relgroup ul { margin: 0; padding-left: 16px; }
  .relgroup li { padding: 1px 0; }

  /* edge-count affordance (preview / tooltip / member list) */
  .edgecount {
    display: inline-block; font-size: 10.5px; line-height: 1.4; padding: 0 6px;
    border-radius: 9px; background: var(--accent-soft); color: var(--accent);
    margin-left: 5px; vertical-align: middle; font-variant-numeric: tabular-nums;
  }
  #tooltip .edgecount { background: #3a4961; color: #cdd7e8; }

  /* index member list (rendered by the viewer from belongs_to reverse edges) */
  .members { margin: 18px 0 6px; }
  .members > h2 { font-size: 17px; margin: 0 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .members ul { list-style: none; margin: 0; padding: 0; }
  .members li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .members li:last-child { border-bottom: none; }
  .members li .msum { color: var(--muted); font-size: 12.5px; margin-left: 4px; }
  .members li .pill { vertical-align: baseline; }

  /* index compose */
  .compose-btn { margin: 14px 0; }
  button.act { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button.act:hover { opacity: .9; }
  button.act.ghost { background: var(--accent-soft); color: var(--accent); }
  .member-sec { margin: 18px 0; padding-top: 8px; border-top: 1px solid var(--line); }
  .member-sec > h2.mtitle { font-size: 17px; }

  /* catalog */
  .catalog-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 24px 12px; }
  .catalog-tools select, .catalog-tools input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; background: var(--panel); }
  .preset { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  .preset:hover { background: var(--accent); color: #fff; }
  table.catalog { width: calc(100% - 48px); margin: 0 24px 40px; border-collapse: collapse; background: var(--panel); }
  table.catalog th, table.catalog td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  table.catalog th { position: sticky; top: 49px; background: var(--panel); cursor: pointer; user-select: none; }
  table.catalog tr.grouphdr td { background: var(--accent-soft); font-weight: 600; color: var(--accent); }
  .count-note { color: var(--faint); font-size: 12px; margin: 0 24px 8px; }

  /* reviews */
  .review { }
  .review .rid { font-family: var(--mono); font-size: 13px; }
  .review .unsigned { border-left: 4px solid var(--warn); }
  .review .signed { border-left: 4px solid #6a9a5b; }
  .review .badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; }
  .review .badge.unsigned { background: var(--warn-bg); color: var(--warn); }
  .review .badge.signed { background: #e6f1e2; color: #4d7a3f; }
  .snippet { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .snippet code { background: #2b2b2b; color: #f0f0f0; padding: 6px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12px; }
  .copybtn { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .copybtn:hover { background: var(--accent); color: #fff; }

  /* history timeline */
  .timeline { margin-top: 22px; }
  .timeline > summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600; list-style: none; padding: 4px 0; }
  .timeline > summary::-webkit-details-marker { display: none; }
  .timeline > summary::before { content: "▸ "; color: var(--faint); }
  .timeline[open] > summary::before { content: "▾ "; }
  .timeline ol { list-style: none; margin: 8px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
  .timeline li { position: relative; padding: 0 0 12px 14px; font-size: 13px; }
  .timeline li::before { content: ""; position: absolute; left: -7px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-soft); border: 2px solid var(--accent); }
  .timeline .when { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .timeline .what { color: var(--ink); margin-top: 1px; }
  .timeline .what p { margin: 0; }

  /* reviews */
  .rev-card { padding: 0; overflow: hidden; }
  .rev-head { padding: 12px 16px; cursor: pointer; user-select: none; }
  .rev-head:hover { background: var(--accent-soft); }
  .rev-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rev-head .rev-toggle { color: var(--faint); font-size: 12px; width: 12px; flex: none; }
  .rev-head .rev-when { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .rev-head .spacer { flex: 1; }
  .rev-metrics {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    margin: 10px 0 0 22px;
  }
  .rev-group {
    display: inline-flex; align-items: baseline; gap: 8px;
    padding: 4px 10px 4px 8px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #fafaf8; font-size: 13px; line-height: 1.3;
  }
  .rev-group .rev-glabel {
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--faint);
  }
  .rev-group .rev-gnum { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
  .rev-group .rev-gunit { color: var(--muted); font-weight: 400; }
  .rev-group .rev-gsep { color: var(--line); margin: 0 1px; }
  .rev-blurb {
    margin: 10px 0 0 22px; color: var(--muted); font-size: 13.5px;
    font-style: italic; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .rev-card.open .rev-blurb { -webkit-line-clamp: unset; overflow: visible; }
  .rev-body { padding: 4px 16px 16px; border-top: 1px solid var(--line); display: none; }
  .rev-card.open .rev-body { display: block; }
  .sig { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 12px; background: #e6f1e2; color: #4d7a3f; }
  .sig::before { content: "✓"; font-size: 11px; }
  .sig .sig-at { color: var(--faint); font-size: 10.5px; }

  /* tooltip */
  #tooltip {
    position: fixed; z-index: 200; max-width: 340px; pointer-events: none;
    background: #1f1f1f; color: #f2f2f2; border-radius: 8px; padding: 10px 12px;
    font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.25);
    display: none;

<script>
/* ---- inlined data (the export contract: frontmatter + body) ---- */
const DOCS = /*__DOCS_JSON__*/;

const VIEWER_CONFIG = /*__VIEWER_CONFIG__*/;
</script>
<script>
/* ---- vendored markdown renderer (marked, MIT) ---- */
/*__MARKED_JS__*/
</script>
<script>
"use strict";
marked.setOptions({ gfm: true, breaks: false });

/* ===== build in-memory maps ===== */
const byId = new Map();
DOCS.forEach(d => byId.set(String(d.id), d));

const byTermId = new Map();
const termMatchList = []; // longest-first surfaces for implicit auto-link
(LEXICON || []).forEach(t => {
  byTermId.set(String(t.id), t);
  const surfaces = [
    t.display, t.term, t.id, String(t.id).split("/").pop(),
    ...(t.allowed_aliases || []),
    ...(t.restricted_aliases || []),
  ].filter(Boolean);
  const seen = new Set();
  surfaces.forEach(s => {
    const k = String(s).toLowerCase();
    if (seen.has(k)) return;
    seen.add(k);
    termMatchList.push({ surface: String(s), id: String(t.id) });
  });
});
termMatchList.sort((a, b) => b.surface.length - a.surface.length);

function slugifyTerm(s) {
  return String(s || "").trim().toLowerCase()
    .replace(/_/g, "-").replace(/\s+/g, "-")
    .replace(/[^a-z0-9/-]+/g, "-")
    .replace(/-+/g, "-").replace(/^-|-$/g, "");
}

  if (!raw) return null;
  if (byTermId.has(raw)) return raw;
  const m = raw.match(/^\(\s*([^)]+?)\s*\)\s+(.+)$/);
  if (m) return slugifyTerm(m[1]) + "/" + slugifyTerm(m[2]);
  return slugifyTerm(raw);
}

/* Reference/archived docs are kept in byId for link resolution but hidden from
   most navigational surfaces (tree, graph, catalog default). */
function isArchived(d) {
  if (!d) return true;
  return d.status === "reference" || d.type === "reference";
}
function isGraphEligible(id) {
  const d = byId.get(String(id));
  return d && !isArchived(d);
}

function applyViewerConfig() {
  const cfg = VIEWER_CONFIG || {};
  const title = cfg.title || "live_docs";
  const subtitle = cfg.subtitle || "viewer · read-only";
  document.title = title;
  if (cfg.favicon) {
    const link = document.getElementById("favicon-link");
    if (link) link.href = cfg.favicon;
  }
  const brand = document.querySelector("header.topnav .brand");
  if (brand) {
    brand.innerHTML = subtitle
      ? `${escapeHtml(title)} <small>${escapeHtml(subtitle)}</small>`
      : escapeHtml(title);

function idBadge(id, opts) {
  opts = opts || {};
  const title = opts.title ? ` title="doc id"` : "";
  return `<code class="docid"${title}>${escapeHtml(String(id))}</code>`;
}

// normalize an edge value: either "[[id]]" or bare id or "id.md" -> bare id
function edgeId(v) {
  if (v == null) return null;
  let s = String(v).trim();
  const m = s.match(/\[\[([0-9]+)\]\]/);
  if (m) return m[1];

}

  const v = d[field];
  if (!v) return [];
  const arr = Array.isArray(v) ? v : [v];
  return arr.map(edgeId).filter(Boolean);
}

// the forward edge fields, ordered. The richer EDGE_TYPES table (colors, force
// tuning) is built later for the graph; this bare list is all the early
// reverse-edge indexing needs, and keeps that indexing independent of graph code.
const EDGE_FIELDS = ["belongs_to", "requires", "relates", "provenance", "superseded_by"];
// human labels for each direction, reused by every connections surface
const EDGE_LABEL = {
  belongs_to: "belongs to", requires: "requires", relates: "relates",
  provenance: "provenance", superseded_by: "superseded by",
};
const EDGE_LABEL_IN = {
  requires: "required by", relates: "related from", provenance: "cited by",
  superseded_by: "supersedes",
};

// reverse edges, computed client-side
const requiredBy = new Map();   // id -> [ids that require it]
const children = new Map();      // index id -> [member ids that belong_to it]
DOCS.forEach(d => {
  edgeList(d, "requires").forEach(t => {
    if (!requiredBy.has(t)) requiredBy.set(t, []);
    requiredBy.get(t).push(d.id);
  });
  edgeList(d, "belongs_to").forEach(t => {
    if (!children.has(t)) children.set(t, []);
    children.get(t).push(d.id);
  });
});

function labelOf(id) {
  const d = byId.get(String(id));
  if (!d) return null;
  return d.label || d.title || d.id;
}

/* ===== STRUCTURAL SIGNPOSTS (the retired `index` type, re-derived) =====
   The `index` doc type is gone: a doc is a signpost STRUCTURALLY, by having
   descendants via belongs_to. We compute, once:
     - parentsOf(id)  : the belongs_to targets that actually resolve to a doc
     - descCount(id)  : transitive descendant count (size of the subtree below id)
     - isSignpost(id) : has at least one direct child (children map non-empty)
     - belongsRoots   : docs with no resolving belongs_to parent (topological roots)
   These replace every former `type === "index"` test in the viewer. */
function parentsOf(id) {
  const d = byId.get(String(id));
  if (!d) return [];
  return edgeList(d, "belongs_to").filter(p => byId.has(p));
}
function isSignpost(id) {
  const kids = children.get(String(id));
  return !!(kids && kids.length);
}
// transitive descendant count, memoized; cycle-guarded.
const _descCache = new Map();
function descCount(id) {
  const sid = String(id);
  if (_descCache.has(sid)) return _descCache.get(sid);
  const seen = new Set();
  (function walk(n) {
    (children.get(String(n)) || []).forEach(c => {
      if (!seen.has(c)) { seen.add(c); walk(c); }

// of the topology — entry-point candidates (the big ones) and orphans (the rest).
const belongsRoots = DOCS.filter(d => parentsOf(d.id).length === 0);

/* ===== EFFECTIVE SCOPE (client-side, no Python helper) =====
   `scope` is a string naming a topological zone (may also arrive as a 1-element
   list during migration — we normalize both). A doc's EFFECTIVE scope is the
   UNION of `scope` values along its belongs_to ancestor chain, including its own.
   Computed purely from the inlined docs. Memoized; cycle-guarded. If nothing
   resolves, returns [] and callers render nothing. */
function ownScopes(d) {
  const v = d && d.scope;
  if (v == null) return [];
  const arr = Array.isArray(v) ? v : [v];

  const sid = String(id);
  if (_scopeCache.has(sid)) return _scopeCache.get(sid);
  _scopeCache.set(sid, []); // cycle guard: a doc mid-walk contributes nothing yet
  const acc = new Set();
  const d = byId.get(sid);
  if (d) {
    ownScopes(d).forEach(s => acc.add(s));
    parentsOf(sid).forEach(p => effectiveScopes(p).forEach(s => acc.add(s)));
  }
  const out = [...acc].sort();
  _scopeCache.set(sid, out);
  return out;

/* scope PATH for display: anchor scopes along the belongs_to chain root→leaf. */
const _scopePathPartsCache = new Map();
function scopePathParts(id) {
  const sid = String(id);
  if (_scopePathPartsCache.has(sid)) return _scopePathPartsCache.get(sid);
  _scopePathPartsCache.set(sid, []); // cycle guard
  const parts = [];
  const nodes = [];
  const seen = new Set();
  let cur = sid;
  while (cur && !seen.has(cur)) {
    seen.add(cur);
    nodes.unshift(cur);
    const ps = parentsOf(cur);
    if (!ps.length) break;
    cur = ps.slice().sort()[0];
  }
  nodes.forEach(nid => {
    const d = byId.get(nid);
    if (d) ownScopes(d).forEach(s => { if (!parts.includes(s)) parts.push(s); });
  });
  _scopePathPartsCache.set(sid, parts);
  return parts;
}
function scopePath(id) { return scopePathParts(id).join("/"); }

function ownDomains(d) {
  const v = d && d.domain;
  if (v == null) return [];
  const arr = Array.isArray(v) ? v : [v];
  return arr.map(x => String(x).trim()).filter(Boolean).sort();
}

/* Built-in schema enums → Title Case for display; scope/domain stay store-defined. */
function titleCaseEnum(s) {
  if (!s) return "";
  return String(s).split(/[-_]+/).filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
    .join(" ");
}
function enumDisplay(field, val) {
  if (!val || val === "(none)") return val === "(none)" ? "(none)" : "";
  if (field === "type" || field === "status" || field === "level") return titleCaseEnum(val);
  return String(val);
}

const _domainColorCache = new Map();
function domainColor(name) {
  if (_domainColorCache.has(name)) return _domainColorCache.get(name);
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  const hue = (h + 160) % 360;
  const c = { bg: `hsl(${hue} 42% 93%)`, fg: `hsl(${hue} 38% 30%)`, border: `hsl(${hue} 35% 80%)` };
  _domainColorCache.set(name, c);
  return c;
}
// scope as breadcrumb trail (not a pill). Catalog mode: each segment filters scope.
function scopeBreadcrumbs(id, opts) {
  opts = opts || {};
  const parts = scopePathParts(id);
  if (!parts.length) return "";
  const title = opts.title ? ` title="effective scope path (anchors along belongs_to chain)"` : "";
  if (opts.catalog) {
    return `<span class="scopecrumbs"${title}>`
      + parts.map((p, i) => (i ? `<span class="sep">/</span>` : "")
        + `<button type="button" class="crumb cat-facet" data-cf="scope" data-cv="${escapeHtml(p)}">${escapeHtml(p)}</button>`).join("")
      + `</span>`;
  }
  return `<span class="scopecrumbs"${title}>`
    + parts.map((p, i) => (i ? `<span class="sep">/</span>` : "") + `<span class="crumb">${escapeHtml(p)}</span>`).join("")
    + `</span>`;
}
// domain tags as colored pill(s). Catalog mode: each pill filters domain.
function domainTags(id, opts) {
  opts = opts || {};
  const d = byId.get(String(id));
  const domains = d ? ownDomains(d) : [];
  if (!domains.length) return "";
  const title = opts.title ? ` title="domain tags (cross-cutting, not inherited)"` : "";
  return domains.map(s => {
    const c = domainColor(s);
    if (opts.catalog) {
      return `<button type="button" class="domainpill cat-facet" style="background:${c.bg};color:${c.fg};border-color:${c.border}"${title} `
        + `data-cf="domain" data-cv="${escapeHtml(s)}">${escapeHtml(s)}</button>`;
    }

}
function facetDisplay(id, opts) {

  return [sb, dt].filter(Boolean).join(" ");
}
// catalog cell: clickable facet chip for type/status/level
function catEnumFacet(field, value) {
  if (!value) return '<span class="sub">—</span>';
  const label = enumDisplay(field, value);
  if (field === "status") {
    return `<button type="button" class="pill ${escapeHtml(value)} cat-facet" data-cf="${field}" data-cv="${escapeHtml(value)}">${escapeHtml(label)}</button>`;
  }
  return `<button type="button" class="facet-plain cat-facet" data-cf="${field}" data-cv="${escapeHtml(value)}">${escapeHtml(label)}</button>`;
}
function groupKeyLabel(field, k) {
  if (k === "(none)") return "(none)";
  if (field === "type" || field === "status" || field === "level") return enumDisplay(field, k);
  return k;
}

// who points AT this doc, by edge type (the reverse/incoming edges). Computed
// once up-front so every surface — backlinks lists, counts, tooltips — agrees.
// belongs_to-incoming is the index membership; it's surfaced separately as the
// member list, so backlink groups intentionally fold it under "members".
const incomingByType = new Map();   // id -> { edgeKey: [ids] }
DOCS.forEach(s => {
  EDGE_FIELDS.forEach(key => {
    edgeList(s, key).forEach(target => {
      let m = incomingByType.get(target);
      if (!m) { m = {}; incomingByType.set(target, m); }
      (m[key] = m[key] || []).push(String(s.id));
    });
  });

function incomingOf(id) { return incomingByType.get(String(id)) || {}; }

// total degree = distinct neighbors across every edge type, both directions.
// Used for the "this doc HAS connections" affordance (count badge).
function edgeCount(id) {
  const seen = new Set();
  const d = byId.get(String(id));
  if (d) EDGE_FIELDS.forEach(k => edgeList(d, k).forEach(o => { if (byId.has(o)) seen.add(o); }));
  const inc = incomingOf(id);
  Object.values(inc).forEach(arr => arr.forEach(o => seen.add(String(o))));
  return seen.size;
}

function edgeBadge(id) {
  const n = edgeCount(id);
  if (!n) return "";
  return `<span class="edgecount" title="${n} connection${n===1?"":"s"} — open to navigate">⇄ ${n}</span>`;
}

/* ===== edge-type model (shared by the neighborhood graph) ===== */
const GRAPH_EDGE_TYPES = [
  { key: "belongs_to",    label: "belongs to",   color: "#5b6e8c", dist: 70,  strength: 0.9 },
  { key: "children",      label: "members",      color: "#6a82a8", dist: 70,  strength: 0.85 },
  { key: "requires",      label: "requires",     color: "#b07a2a", dist: 95,  strength: 0.7 },
  { key: "required_by",   label: "required by",  color: "#c9923f", dist: 95,  strength: 0.7 },
  { key: "relates",       label: "relates",      color: "#6a9a5b", dist: 140, strength: 0.35 },
  { key: "superseded_by", label: "superseded by",color: "#b03a3a", dist: 90,  strength: 0.7 },
];
// provenance is intentionally excluded from the neighborhood graph.
const EDGE_TYPES = GRAPH_EDGE_TYPES;

/* ===== THE RESOLVER — one pass, used by every surface =====
   Renders raw markdown to HTML, with wiki-links and md-links resolved to labels.
   - [[id]]   -> <a> showing label, hover tooltip, click=expand, dblclick=navigate
   - ![[id]]  -> transclude body inline
   - [text](id.md) -> same resolved link (index "Map" bodies use this form)
   Unresolved ids render as visible broken links. */

// Resolved label-link. When opts.icon is true, the doc's type icon is rendered
// immediately BEFORE the label (the icon now carries the `type`, replacing the
// old trailing pill). Default is no icon so inline prose links stay clean; the
// connections/member/home/catalog/tree/reader surfaces opt in explicitly.
function linkHtml(id, overrideText, opts) {
  opts = opts || {};
  const sid = String(id);
  const d = byId.get(sid);
  if (!d) {
    return `<a class="dl broken" data-broken="1">${overrideText || sid}</a>`;
  }
  const text = overrideText || d.label || d.title || sid;
  const ic = opts.icon ? typeIcon(d.type) : "";

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function termLinkHtml(termId, overrideText) {
  const t = byTermId.get(String(termId));
  const text = overrideText || (t && t.display) || termId;
  if (!t) {
    return `<a class="tl broken" data-term="${escapeHtml(String(termId))}" data-missing="1">${escapeHtml(text)}</a>`;
  }
  return `<a class="tl" data-term="${escapeHtml(String(termId))}" tabindex="0">${escapeHtml(text)}</a>`;
}

/** Render prose that may contain {{term}} / [[id]] links (definitions, tooltips). */
function renderInlineProse(src) {
  let html = renderMarkdown(src || "");
  // Collapse a single outer paragraph for table/tooltip density.
  const m = String(html).match(/^<p>([\s\S]*)<\/p>\s*$/i);
  if (m && !/<p[\s>]/i.test(m[1])) return m[1];
  return html;
}

function autolinkTermsSegment(text, tokens) {
  if (!text || !termMatchList.length) return text;
  let out = "";
  let i = 0;
  while (i < text.length) {
    // never auto-link inside an already-emitted TOKEN placeholder
    if (text.startsWith("TOKEN", i)) {
      const m = text.slice(i).match(/^TOKEN\d+TOKEN/);
      if (m) { out += m[0]; i += m[0].length; continue; }
    }
    let hit = null;
    for (const cand of termMatchList) {
      const s = cand.surface;
      if (text.length - i < s.length) continue;
      if (text.slice(i, i + s.length).toLowerCase() !== s.toLowerCase()) continue;
      const before = i === 0 ? "" : text[i - 1];
      const after = text[i + s.length] || "";
      if (before && /[A-Za-z0-9_]/.test(before)) continue;
      if (after && /[A-Za-z0-9_]/.test(after)) continue;
      hit = cand;
      break;
    }
    if (hit) {
      const n = tokens.length;
      tokens.push({ kind: "term", id: hit.id, text: text.slice(i, i + hit.surface.length) });
      out += `TOKEN${n}TOKEN`;
      i += hit.surface.length;
    } else {
      out += text[i];
      i += 1;
    }

  return out;
}

const TYPE_ICONS = {

    svg: `<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/>` },

  // decision — a fork in the road that was taken: git-fork
  "decision":    { color: "#3f7a55", label: "decision",
    svg: `<circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/>` },

    svg: `<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>` },

};
// fallback glyph for any unknown/missing type: a neutral circle (help-circle-ish dot)
const TYPE_ICON_FALLBACK = { color: "var(--faint)", label: "unknown",
  svg: `<circle cx="12" cy="12" r="9"/><path d="M12 17h.01"/><path d="M9.5 9a2.5 2.5 0 0 1 4.5 1.5c0 1.5-2 2-2 3"/>` };

/* Canonical type ordering (high-level → concrete). Used anywhere the viewer
   lists docs without an established sort (tree siblings, member lists, orphans,
   connection groups, catalog default). Reviews keep newest-first. Catalog column
   clicks override the default. Unknown types sort after reference, alpha by name. */
const TYPE_ORDER = [
  "use-case", "principle", "requirement", "constraint",
  "component", "decision", "guide", "reference",
];
function typeRank(t) {
  const s = String(t || "");
  const i = TYPE_ORDER.indexOf(s);
  return i >= 0 ? i : TYPE_ORDER.length;
}
function docSortKey(d) {
  return String((d && (d.label || d.title || d.id)) || "");
}
function compareDocsByTypeThenLabel(a, b) {
  const tr = typeRank(a.type) - typeRank(b.type);
  if (tr) return tr;
  const ta = String(a.type || ""), tb = String(b.type || "");
  if (ta !== tb) return ta.localeCompare(tb);
  return docSortKey(a).localeCompare(docSortKey(b));
}
function compareIdsByTypeThenLabel(a, b) {
  const da = byId.get(String(a)), db = byId.get(String(b));
  if (!da && !db) return String(a).localeCompare(String(b));
  if (!da) return 1;
  if (!db) return -1;
  return compareDocsByTypeThenLabel(da, db);
}
function sortTypes(arr) {
  return arr.slice().sort((a, b) => typeRank(a) - typeRank(b) || String(a).localeCompare(String(b)));
}
function sortGroupKeys(field, keys) {
  if (field === "type") return sortTypes(keys);
  return keys.slice().sort((a, b) => String(a).localeCompare(String(b)));
}

// render the icon for a doc `type` as an inline <svg>, sized to text via the .ticon
// wrapper. Returns "" for no type so callers can interpolate unconditionally.
function typeIcon(type, opts) {
  opts = opts || {};
  const t = type ? String(type) : "";
  if (!t) return "";
  const def = TYPE_ICONS[t] || TYPE_ICON_FALLBACK;
  const title = opts.title === false ? "" : ` title="${escapeHtml(titleCaseEnum(t) || def.label || t)}"`;
  return `<span class="ticon" style="color:${def.color}"${title}>`
    + `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" `
    + `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${def.svg}</svg></span>`;
}

function applyViewerThemeOverrides() {
  const cfg = VIEWER_CONFIG || {};
  const dc = cfg.domain_colors || {};
  Object.entries(dc).forEach(([name, val]) => {
    if (typeof val === "string") {
      _domainColorCache.set(name, { bg: val + "22", fg: val, border: val + "55" });
    } else if (val && typeof val === "object") {
      _domainColorCache.set(name, val);
    }
  });
  const ti = cfg.type_icons || {};
  Object.entries(ti).forEach(([t, val]) => {
    if (!TYPE_ICONS[t]) TYPE_ICONS[t] = { ...TYPE_ICON_FALLBACK, svg: TYPE_ICON_FALLBACK.svg };
    if (val.color) TYPE_ICONS[t].color = val.color;
    if (val.label) TYPE_ICONS[t].label = val.label;
    if (val.svg) TYPE_ICONS[t].svg = val.svg;
  });
}

// Pre-process markdown: replace link syntaxes with placeholder tokens, render md,
// then swap tokens for resolved anchors/transclusions. This keeps marked from
// mangling our custom links and lets transclusions become block elements.
function renderMarkdown(src, depth) {
  depth = depth || 0;
  if (src == null) return "";
  const tokens = [];
  let s = src;

  // ![[id]] transclusion
  s = s.replace(/!\[\[([0-9]+)\]\]/g, (_, id) => {
    const i = tokens.length;
    tokens.push({ kind: "trans", id });
    return `\n\nTOKEN${i}TOKEN\n\n`;
  });
  // [[id]] doc wiki-link (14-digit)
  s = s.replace(/\[\[([0-9]{14})\]\]/g, (_, id) => {
    const i = tokens.length;
    tokens.push({ kind: "link", id });
    return `TOKEN${i}TOKEN`;
  });
  // {{Term}} / {{(Context) Term}} / {{path}} — soft lexicon links
  // Optional {{id|Display}} and trailing inflection: {{Hard Edge}}s → "Hard Edges"
  s = s.replace(/\{\{([^}|]+?)(?:\|([^}]*))?\}\}([A-Za-z]*)/g, (_, target, alias, suffix) => {
    const tid = parseTermRef(String(target).trim());
    const display = (alias && String(alias).trim() ? String(alias).trim() : String(target).trim()) + (suffix || "");
    const i = tokens.length;
    tokens.push({ kind: "term", id: tid, text: display });
    return `TOKEN${i}TOKEN`;
  });
  // [text](14digits.md) markdown link -> resolved link using the doc's label
  s = s.replace(/\[([^\]]*)\]\(([0-9]{6,})\.md\)/g, (_, text, id) => {
    const i = tokens.length;
    tokens.push({ kind: "link", id, text: byId.has(id) ? null : text }); // prefer canonical label
    return `TOKEN${i}TOKEN`;
  });

  // Implicit auto-link of known term surfaces — opt-in formatting
  // (VIEWER_CONFIG.autolink_terms or ?autolink=1). Explicit {{Term}} always on.
  const cfgAuto = !!(VIEWER_CONFIG && VIEWER_CONFIG.autolink_terms);
  const urlAuto = /(?:\?|&)autolink=1(?:&|$)/.test(location.search || "");
  if (cfgAuto || urlAuto) s = autolinkTermsSegment(s, tokens);

  let html = marked.parse(s);

  html = html.replace(/TOKEN(\d+)TOKEN/g, (_, n) => {
    const t = tokens[+n];
    if (!t) return "";
    if (t.kind === "link") return linkHtml(t.id, t.text || null, { icon: 1 });
    if (t.kind === "term") return termLinkHtml(t.id, t.text || null);
    if (t.kind === "trans") {
      const d = byId.get(String(t.id));
      if (!d) return `<span class="dl broken">${t.id}</span>`;
      const inner = depth < 4 ? renderMarkdown(d.body, depth + 1) : "<em>(transclusion depth limit)</em>";
      return `<div class="transclude"><div class="th">transcluded · ${escapeHtml(d.label || d.id)}</div>${inner}</div>`;
    }
    return "";
  });
  return html;
}

/* ===== tooltip + link interactions (delegated) ===== */
const tooltip = document.getElementById("tooltip");
function showTip(el) {
  const termId = el.getAttribute("data-term");
  if (termId) {
    const t = byTermId.get(String(termId));
    if (!t) {
      tooltip.innerHTML =
        `<div class="tt-label">${escapeHtml(termId)}</div>` +
        `<div class="tt-meta">lexicon · undocumented</div>` +
        `<div class="tt-sum">No definition yet — a soft link saying this term should be documented.</div>`;
      tooltip.style.display = "block";
      return;
    }
    const n = (t.stats && t.stats.docs) || 0;
    tooltip.innerHTML =
      `<div class="tt-label">${escapeHtml(t.display || t.term || termId)}</div>` +
      `<div class="tt-meta">lexicon${t.context ? " · " + escapeHtml(t.context) : ""} · ${n} doc${n === 1 ? "" : "s"}</div>` +
      `<div class="tt-sum">${renderInlineProse(t.definition || "(no definition)")}</div>`;
    tooltip.style.display = "block";
    return;
  }
  const id = el.getAttribute("data-ref");
  const d = byId.get(String(id));
  if (!d) return;
  const status = d.status ? `<span class="pill ${d.status}">${enumDisplay("status", d.status)}</span>` : "";
  // next-hop affordance: show how many connections this doc has so the reader
  // knows there's somewhere to go without opening it.
  const count = edgeBadge(d.id);
  const facets = facetDisplay(d.id);
  // type icon before the label; the type name still reads in the meta line
  tooltip.innerHTML =
    `<div class="tt-label">${typeIcon(d.type)}${escapeHtml(d.label || d.title || id)} ${idBadge(id)}</div>` +
    `<div class="tt-meta">${escapeHtml(enumDisplay("type", d.type))} ${status} ${facets} ${count}</div>` +
    `<div class="tt-sum">${escapeHtml(d.summary || "(no summary)")}</div>`;
  tooltip.style.display = "block";
}
function moveTip(e) {
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const r = tooltip.getBoundingClientRect();
  if (x + r.width > window.innerWidth) x = e.clientX - r.width - pad;
  if (y + r.height > window.innerHeight) y = e.clientY - r.height - pad;
  tooltip.style.left = x + "px"; tooltip.style.top = y + "px";
}
function hideTip() { tooltip.style.display = "none"; }

document.addEventListener("mouseover", e => {
  const a = e.target.closest("a.dl[data-ref], a.tl[data-term]");
  if (a) showTip(a);
});
document.addEventListener("mousemove", e => {
  if (tooltip.style.display === "block") moveTip(e);
});
document.addEventListener("mouseout", e => {
  if (e.target.closest("a.dl[data-ref], a.tl[data-term]")) hideTip();
});

// single click = expand in place (accordion); double click = navigate
let clickTimer = null;
document.addEventListener("click", e => {
  const tl = e.target.closest("a.tl[data-term]");
  if (tl) {
    e.preventDefault();
    hideTip();
    location.hash = "#/term/" + encodeURIComponent(tl.getAttribute("data-term"));
    return;
  }
  const a = e.target.closest("a.dl[data-ref]");
  if (!a) return;
  e.preventDefault();
  if (clickTimer) return; // wait to see if it becomes a dblclick
  clickTimer = setTimeout(() => {
    clickTimer = null;
    toggleExpand(a);
  }, 220);
});
document.addEventListener("dblclick", e => {
  const a = e.target.closest("a.dl[data-ref]");
  if (!a) return;
  e.preventDefault();
  if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
  hideTip();
  location.hash = "#/" + a.getAttribute("data-ref");
});

/* ===== nav / routing ===== */
const pages = ["home", "reader", "catalog", "lexicon", "reviews"];
function activate(page) {
  pages.forEach(p => {
    document.getElementById("page-" + p).classList.toggle("active", p === page);
  });
  document.querySelectorAll("header.topnav nav button").forEach(b =>
    b.classList.toggle("active", b.getAttribute("data-page") === page));
}
document.querySelectorAll("header.topnav nav button").forEach(b => {
  b.addEventListener("click", () => {
    const p = b.getAttribute("data-page");
    if (p === "reader") location.hash = location.hash.startsWith("#/") ? location.hash : "#/reader";
    else location.hash = "#" + p;
  });
});

function route() {
  const h = location.hash || "#home";
  if (h.startsWith("#/term/")) {
    hideReaderGraph();
    activate("lexicon");
    renderLexicon(h.slice("#/term/".length));
    return;
  }
  if (h.startsWith("#/")) {
    const id = h.slice(2);
    activate("reader");
    renderReader(id && byId.has(id) ? id : null);
  } else {
    hideReaderGraph();
    const p = h.slice(1);
    activate(pages.includes(p) ? p : "home");
    if ((p || "home") === "lexicon") renderLexicon();
  }
}
window.addEventListener("hashchange", () => {
  closeSidePreview();
  route();
});

/* ===== HOME / DASHBOARD ===== */
function renderHome() {
  const el = document.getElementById("page-home");
  const byType = {}, byStatus = {};
  DOCS.forEach(d => {
    byType[d.type || "?"] = (byType[d.type || "?"] || 0) + 1;
    byStatus[d.status || "?"] = (byStatus[d.status || "?"] || 0) + 1;
  });
  // Entry points are STRUCTURAL now (the `index` type is retired): a signpost is
  // a doc that bears descendants via belongs_to. Rank by transitive descendant
  // count so the biggest subtrees float to the top; the root component leads.
  const signposts = DOCS.filter(d => isSignpost(d.id) && !isArchived(d))
    .sort((a, b) => descCount(b.id) - descCount(a.id) || String(labelOf(a.id)).localeCompare(String(labelOf(b.id))));
  // orphans = belongs_to roots that lead nowhere (no descendants, no parent) and
  // aren't themselves a signpost. These are the docs curation hasn't placed yet.
  const orphans = belongsRoots.filter(d => !isSignpost(d.id) && !isArchived(d));
  const deprecated = DOCS.filter(d => d.status === "deprecated");
  const churnOf = d => (Array.isArray(d.history) ? d.history : []).filter(h =>
    !(Array.isArray(h.change_type) ? h.change_type.includes("addition") : h.change_type === "addition")).length;
  const hot = DOCS.filter(d => !isArchived(d)).map(d => ({ d, churn: churnOf(d) })).filter(x => x.churn > 0)
    .sort((a, b) => b.churn - a.churn).slice(0, 8);

  const statBox = (n, l) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;

  let html = `<h1 class="pagetitle">Dashboard</h1><div class="sub">Orientation for the live_docs store — every link below resolves to a label; hover for summary, single-click to expand, double-click to open in Reader.</div>`;
  html += `<div class="stats">`;
  html += statBox(DOCS.length, "total docs");
  sortTypes(Object.keys(byType)).forEach(t => html += statBox(byType[t], titleCaseEnum(t)));
  html += `</div>`;
  html += `<div class="stats">`;
  Object.keys(byStatus).sort().forEach(s => html += statBox(byStatus[s], "status: " + enumDisplay("status", s)));
  html += `</div>`;

  // surface the root component prominently — the single doc whose subtree is the
  // whole store. (Largest signpost; falls out of the descendant-count ranking.)
  const root = signposts[0];
  if (root) {
    const rsum = byId.get(String(root.id));
    html += `<div class="card" style="border-left:3px solid var(--accent)">`
      + `<h3>The store root</h3>`
      + `<div style="font-size:15px;font-weight:600">${linkHtml(root.id, null, {icon:1})} ${facetDisplay(root.id, {title:1})} <span class="edgecount" title="docs in this subtree">⤵ ${descCount(root.id)} descendants</span></div>`
      + `<div class="sub" style="margin:4px 0 0">${escapeHtml((rsum && rsum.summary) || "")}</div></div>`;
  }

  html += `<div class="dash-cols">`;
  // entry points / signposts — descendant-bearing docs, ranked by subtree size.
  // (Replaces the old type:index list, of which there are now zero.)
  html += `<div class="card"><h3>Entry points — signposts (${signposts.length})</h3>`
    + `<div class="sub" style="margin:0 0 6px">Descendant-bearing docs, ranked by subtree size.</div><ul class="tight">`;
  signposts.forEach(d => {
    const sub = escapeHtml(d.summary || "");
    html += `<li>${linkHtml(d.id, null, {icon:1})} ${idBadge(d.id)} ${facetDisplay(d.id)} <span class="edgecount" title="descendants in subtree">⤵ ${descCount(d.id)}</span>`
      + (sub ? `<div class="sub" style="margin:2px 0 0">${sub}</div>` : "") + `</li>`;
  });
  html += `</ul></div>`;

  // hot docs
  html += `<div class="card"><h3>Hot docs (most changes)</h3><ul class="tight">`;
  hot.forEach(x => html += `<li>${linkHtml(x.d.id, null, {icon:1})} <span class="pill">${x.churn} changes</span></li>`);
  html += `</ul></div>`;

  // orphans — belongs_to roots that bear no descendants (unplaced by curation)
  html += `<div class="card"><h3>Orphans — no belongs_to, no descendants (${orphans.length})</h3><ul class="tight">`;
  if (!orphans.length) html += `<li class="sub">none</li>`;
  orphans.slice().sort(compareDocsByTypeThenLabel).forEach(d => html += `<li>${linkHtml(d.id, null, {icon:1})} ${facetDisplay(d.id)}</li>`);
  html += `</ul></div>`;

  // deprecated -> superseded_by
  html += `<div class="card"><h3>Deprecated → superseded by (${deprecated.length})</h3><ul class="tight">`;
  if (!deprecated.length) html += `<li class="sub">none</li>`;
  deprecated.slice().sort(compareDocsByTypeThenLabel).forEach(d => {
    const sup = edgeList(d, "superseded_by");
    const supHtml = sup.length ? sup.map(s => linkHtml(s, null, {icon:1})).join(", ") : `<span class="dl broken">(no superseded_by!)</span>`;
    html += `<li>${linkHtml(d.id, null, {icon:1})} → ${supHtml}</li>`;
  });
  html += `</ul></div>`;
  html += `</div>`;
  el.innerHTML = html;
}

/* ===== READER ===== */
function buildTree() {
  // Folders are SIGNPOSTS (docs that bear descendants), not type:index — that
  // type is retired. A member that is itself a signpost nests as a sub-folder;
  // members with no descendants are leaves. Tree roots = signposts with no
  // resolving belongs_to parent. Siblings sort type → label; depth is visual.
  const roots = DOCS.filter(d => isSignpost(d.id) && parentsOf(d.id).length === 0 && !isArchived(d))
    .sort(compareDocsByTypeThenLabel);

  function renderNode(idx, seen, depth) {
    seen = seen || new Set();
    if (seen.has(idx.id)) return ""; // guard cycles
    seen = new Set(seen); seen.add(idx.id);
    const memberIds = (children.get(idx.id) || []).filter(mid => !isArchived(byId.get(mid)));
    const childSignposts = memberIds.filter(m => isSignpost(m)).map(m => byId.get(m)).filter(Boolean)
      .sort(compareDocsByTypeThenLabel);
    const leaves = memberIds.filter(m => !isSignpost(m))
      .map(lid => byId.get(lid)).filter(Boolean)
      .sort(compareDocsByTypeThenLabel);
    const nKids = childSignposts.length + leaves.length;
    const countHint = nKids ? `<span class="tree-count">${nKids}</span>` : "";
    const openAttr = depth === 0 ? " open" : "";
    let h = `<div class="tree-node"><details${openAttr}>`
      + `<summary data-ref="${idx.id}">${typeIcon(idx.type)}${escapeHtml(idx.label || idx.title)}${countHint}</summary>`
      + `<div class="tree-children">`;
    childSignposts.forEach(ci => h += renderNode(ci, seen, depth + 1));
    leaves.forEach(d => {
      h += `<div class="leaf" data-id="${d.id}">${typeIcon(d.type)}${escapeHtml(d.label || d.title || d.id)}</div>`;
    });
    h += `</div></details></div>`;
    return h;
  }

  let h = "";
  roots.forEach(r => h += renderNode(r, undefined, 0));

  // Ungrouped catch-all: docs that belong to nothing AND bear no descendants
  // (a signpost with no parent is already a root above, so exclude those).
  const ungrouped = belongsRoots.filter(d => !isSignpost(d.id) && !isArchived(d))
    .sort(compareDocsByTypeThenLabel);
  if (ungrouped.length) {
    h += `<div class="tree-node"><details open><summary>Ungrouped <span class="tree-count">${ungrouped.length}</span></summary><div class="tree-children">`;
    ungrouped.forEach(d => h += `<div class="leaf" data-id="${d.id}">${typeIcon(d.type)}${escapeHtml(d.label || d.title || d.id)}</div>`);
    h += `</div></details></div>`;
  }
  return h;
}

let readerTreeHtml = null;

function wireTreeToolbar(toolbarEl, treeEl) {
