<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>live_docs viewer</title>
<style>
  :root {
    --bg: #f7f6f3;
    --panel: #ffffff;
    --ink: #2b2b2b;
    --muted: #777;
    --faint: #9a9a9a;
    --line: #e4e2dc;
    --accent: #5b6e8c;
    --accent-soft: #eef1f6;
    --link: #3f5e8f;
    --broken: #b03a3a;
    --tag-bg: #eceae4;
    --warn: #b07a2a;
    --warn-bg: #fbf3e2;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header.topnav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 4px;
    padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header.topnav .brand { font-weight: 700; margin-right: 18px; letter-spacing: .3px; }
  header.topnav .brand small { color: var(--faint); font-weight: 400; }
  nav button {
    background: none; border: 1px solid transparent; border-radius: 6px;
    padding: 5px 12px; font-size: 14px; color: var(--muted); cursor: pointer;
  }
  nav button:hover { background: var(--accent-soft); color: var(--ink); }
  nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { padding: 0; }
  .page { display: none; }
  .page.active { display: block; }

  /* generic */
  h1.pagetitle { font-size: 20px; margin: 22px 24px 6px; }
  .sub { color: var(--muted); margin: 0 24px 18px; font-size: 13px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .grid { display: grid; gap: 12px; }
  a.dl { color: var(--link); text-decoration: none; cursor: pointer; border-bottom: 1px dotted var(--link); }
  a.dl:hover { background: var(--accent-soft); }
  a.dl.broken { color: var(--broken); border-bottom-color: var(--broken); }
  a.dl.broken::after { content: " (broken)"; font-size: 11px; }
  .pill {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
    background: var(--tag-bg); color: var(--muted); margin-left: 4px; vertical-align: middle;
  }
  .pill.deprecated { background: #f3e0e0; color: var(--broken); }
  .pill.target { background: var(--warn-bg); color: var(--warn); }
  .pill.reference { background: #e4ecf3; color: var(--accent); }
  /* effective-scope pill: colored per scope name (inline style sets the hue) */
  .scopepill {
    display: inline-block; font-size: 10.5px; line-height: 1.5; padding: 0 7px;
    border-radius: 10px; border: 1px solid transparent; margin-left: 4px;
    vertical-align: middle; font-weight: 600; letter-spacing: .2px;
  }
  #tooltip .scopepill { border-color: transparent; }
  .meta-line .scopepill { margin-left: 0; margin-right: 2px; }

  /* dashboard */
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 24px 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; min-width: 110px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .dash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 0 24px 24px; }
  .dash-cols h3 { font-size: 14px; margin: 0 0 8px; color: var(--accent); }
  @media (max-width: 820px) { .dash-cols { grid-template-columns: 1fr; } }
  ul.tight { margin: 0; padding-left: 0; list-style: none; }
  ul.tight li { padding: 4px 0; border-bottom: 1px solid var(--line); }
  ul.tight li:last-child { border-bottom: none; }

  /* reader */
  .reader { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 49px); }
  .tree { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 8px; overflow-y: auto; max-height: calc(100vh - 49px); position: sticky; top: 49px; }
  .tree details { margin-bottom: 2px; }
  .tree summary { cursor: pointer; padding: 3px 6px; border-radius: 5px; font-weight: 600; font-size: 13px; color: var(--accent); list-style: none; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary:hover { background: var(--accent-soft); }
  .tree .leaf { padding: 3px 6px 3px 22px; font-size: 13px; cursor: pointer; border-radius: 5px; color: var(--ink); }
  .tree .leaf:hover { background: var(--accent-soft); }
  .tree .leaf.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .content { padding: 22px 28px; max-width: 820px; overflow-x: hidden; }
  .content h1.doctitle { font-size: 22px; margin: 0 0 2px; }
  .meta-line { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .doc-summary { color: var(--muted); font-style: italic; border-left: 3px solid var(--line); padding-left: 12px; margin: 0 0 18px; }
  .md { line-height: 1.6; }
  .md h2 { font-size: 17px; margin: 22px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .md h3 { font-size: 15px; margin: 18px 0 6px; }
  .md code { background: var(--tag-bg); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }
  .md pre { background: #2b2b2b; color: #f0f0f0; padding: 12px; border-radius: 8px; overflow-x: auto; }
  .md pre code { background: none; color: inherit; padding: 0; }
  .md blockquote { border-left: 3px solid var(--line); margin: 0; padding-left: 12px; color: var(--muted); }
  .md table { border-collapse: collapse; }
  .md td, .md th { border: 1px solid var(--line); padding: 4px 8px; }

  /* inline expand (accordion) */
  .expand { margin: 6px 0 6px 0; border-left: 3px solid var(--accent-soft); background: #fafaf8; border-radius: 0 6px 6px 0; padding: 8px 12px; }
  .expand .eh { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
  .transclude { border: 1px dashed var(--line); border-radius: 6px; padding: 8px 12px; margin: 8px 0; background: #fafaf8; }
  .transclude .th { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }

  /* neighborhood graph */
  .ngraph { margin-top: 22px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .ngraph > summary { cursor: pointer; font-size: 15px; font-weight: 600; padding: 12px 16px; list-style: none; }
  .ngraph > summary::-webkit-details-marker { display: none; }
  .ngraph > summary::before { content: "▸ "; color: var(--faint); }
  .ngraph[open] > summary::before { content: "▾ "; }
  .ngraph .gwrap { padding: 0 12px 12px; }
  .gcontrols { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 0 4px 8px; font-size: 12px; }
  .gtoggle { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; padding: 2px 8px; border: 1px solid var(--line); border-radius: 12px; user-select: none; }
  .gtoggle.off { opacity: .4; }
  .ghop { display: inline-flex; align-items: center; gap: 8px; padding: 2px 10px 2px 8px; margin-right: 4px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  .ghop label { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
  .ghop input { margin: 0; }
  .gtoggle .swatch { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
  .gcap { color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 4px 10px; font-size: 12px; margin: 0 4px 8px; }
  .gtune { margin: 0 4px 8px; }
  .gtune summary { cursor: pointer; color: var(--accent); font-size: 12px; list-style: none; }
  .gtune summary::-webkit-details-marker { display: none; }
  .gtune table { border-collapse: collapse; margin-top: 6px; font-size: 11.5px; }
  .gtune td { padding: 2px 8px; }
  .gtune input[type=range] { width: 90px; vertical-align: middle; }
  svg.graph { width: 100%; height: 420px; display: block; background: #fcfbf9; border: 1px solid var(--line); border-radius: 6px; cursor: grab; }
  svg.graph .gedge { stroke-opacity: .55; }
  svg.graph .gnode { cursor: pointer; }
  svg.graph .gnode circle { stroke: #fff; stroke-width: 1.5; }
  svg.graph .gnode.focus circle { stroke: var(--ink); stroke-width: 2.5; }
  svg.graph .gnode text { font-size: 10.5px; fill: var(--ink); paint-order: stroke; stroke: #fcfbf9; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
  .ghint { color: var(--faint); font-size: 11.5px; margin: 6px 4px 0; }

  /* relationships panel */
  .rels { margin-top: 28px; border-top: 2px solid var(--line); padding-top: 14px; }
  .rels h2 { font-size: 15px; margin: 0 0 10px; }
  .rels .relcols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 700px) { .rels .relcols { grid-template-columns: 1fr; } }
  .rels .relcol > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); margin: 0 0 6px; }
  .rels .relcol.incoming > h3 { color: var(--warn); }
  .relgroup { margin-bottom: 10px; }
  .relgroup .rt { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin-bottom: 3px; }
  .relgroup ul { margin: 0; padding-left: 16px; }
  .relgroup li { padding: 1px 0; }

  /* edge-count affordance (preview / tooltip / member list) */
  .edgecount {
    display: inline-block; font-size: 10.5px; line-height: 1.4; padding: 0 6px;
    border-radius: 9px; background: var(--accent-soft); color: var(--accent);
    margin-left: 5px; vertical-align: middle; font-variant-numeric: tabular-nums;
  }
  #tooltip .edgecount { background: #3a4961; color: #cdd7e8; }

  /* index member list (rendered by the viewer from belongs_to reverse edges) */
  .members { margin: 18px 0 6px; }
  .members > h2 { font-size: 17px; margin: 0 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .members ul { list-style: none; margin: 0; padding: 0; }
  .members li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .members li:last-child { border-bottom: none; }
  .members li .msum { color: var(--muted); font-size: 12.5px; margin-left: 4px; }
  .members li .pill { vertical-align: baseline; }

  /* index compose */
  .compose-btn { margin: 14px 0; }
  button.act { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button.act:hover { opacity: .9; }
  button.act.ghost { background: var(--accent-soft); color: var(--accent); }
  .member-sec { margin: 18px 0; padding-top: 8px; border-top: 1px solid var(--line); }
  .member-sec > h2.mtitle { font-size: 17px; }

  /* catalog */
  .catalog-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 24px 12px; }
  .catalog-tools select, .catalog-tools input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; background: var(--panel); }
  .preset { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  .preset:hover { background: var(--accent); color: #fff; }
  table.catalog { width: calc(100% - 48px); margin: 0 24px 40px; border-collapse: collapse; background: var(--panel); }
  table.catalog th, table.catalog td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  table.catalog th { position: sticky; top: 49px; background: var(--panel); cursor: pointer; user-select: none; }
  table.catalog tr.grouphdr td { background: var(--accent-soft); font-weight: 600; color: var(--accent); }
  .count-note { color: var(--faint); font-size: 12px; margin: 0 24px 8px; }

  /* reviews */
  .review { }
  .review .rid { font-family: var(--mono); font-size: 13px; }
  .review .unsigned { border-left: 4px solid var(--warn); }
  .review .signed { border-left: 4px solid #6a9a5b; }
  .review .badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; }
  .review .badge.unsigned { background: var(--warn-bg); color: var(--warn); }
  .review .badge.signed { background: #e6f1e2; color: #4d7a3f; }
  .snippet { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .snippet code { background: #2b2b2b; color: #f0f0f0; padding: 6px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12px; }
  .copybtn { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .copybtn:hover { background: var(--accent); color: #fff; }

  /* history timeline */
  .timeline { margin-top: 22px; }
  .timeline > summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600; list-style: none; padding: 4px 0; }
  .timeline > summary::-webkit-details-marker { display: none; }
  .timeline > summary::before { content: "▸ "; color: var(--faint); }
  .timeline[open] > summary::before { content: "▾ "; }
  .timeline ol { list-style: none; margin: 8px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
  .timeline li { position: relative; padding: 0 0 12px 14px; font-size: 13px; }
  .timeline li::before { content: ""; position: absolute; left: -7px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-soft); border: 2px solid var(--accent); }
  .timeline .when { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .timeline .what { color: var(--ink); margin-top: 1px; }
  .timeline .what p { margin: 0; }

  /* reviews (redesigned) */
  .rev-card { padding: 0; overflow: hidden; }
  .rev-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; cursor: pointer; user-select: none; }
  .rev-head:hover { background: var(--accent-soft); }
  .rev-head .rev-toggle { color: var(--faint); font-size: 12px; width: 12px; }
  .rev-head .rev-size { font-weight: 700; font-size: 15px; }
  .rev-head .rev-size small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .rev-head .rev-when { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .rev-head .spacer { flex: 1; }
  .rev-body { padding: 4px 16px 16px; border-top: 1px solid var(--line); display: none; }
  .rev-card.open .rev-body { display: block; }
  .sig { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 12px; background: #e6f1e2; color: #4d7a3f; }
  .sig::before { content: "✓"; font-size: 11px; }
  .sig .sig-at { color: var(--faint); font-size: 10.5px; }

  /* tooltip */
  #tooltip {
    position: fixed; z-index: 200; max-width: 340px; pointer-events: none;
    background: #1f1f1f; color: #f2f2f2; border-radius: 8px; padding: 10px 12px;
    font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.25);
    display: none;
  }
  #tooltip .tt-label { font-weight: 700; margin-bottom: 3px; }
  #tooltip .tt-meta { color: #b9c2d0; font-size: 11px; margin-bottom: 5px; }
  #tooltip .tt-sum { color: #ddd; }
</style>
</head>
<body>
<header class="topnav">
  <div class="brand">live_docs <small>viewer · read-only</small></div>
  <nav>
    <button data-page="home" class="active">Home</button>
    <button data-page="reader">Reader</button>
    <button data-page="catalog">Catalog</button>
    <button data-page="reviews">Reviews</button>
  </nav>
</header>
<main>
  <section id="page-home" class="page active"></section>
  <section id="page-reader" class="page"></section>
  <section id="page-catalog" class="page"></section>
  <section id="page-reviews" class="page"></section>
</main>
<div id="tooltip"></div>

<script>
/* ---- inlined data (the export contract: frontmatter + body) ---- */
const DOCS = /*__DOCS_JSON__*/;
const REVIEWS = /*__REVIEWS_JSON__*/;
</script>
<script>
/* ---- vendored markdown renderer (marked, MIT) ---- */
/*__MARKED_JS__*/
</script>
<script>
"use strict";
marked.setOptions({ gfm: true, breaks: false });

/* ===== build in-memory maps ===== */
const byId = new Map();
DOCS.forEach(d => byId.set(String(d.id), d));

// normalize an edge value: either "[[id]]" or bare id or "id.md" -> bare id
function edgeId(v) {
  if (v == null) return null;
  let s = String(v).trim();
  const m = s.match(/\[\[([0-9]+)\]\]/);
  if (m) return m[1];
  const mf = s.match(/^([0-9]{6,})(?:\.md)?$/);
  if (mf) return mf[1];
  return s;
}
function edgeList(d, field) {
  const v = d[field];
  if (!v) return [];
  const arr = Array.isArray(v) ? v : [v];
  return arr.map(edgeId).filter(Boolean);
}

// the forward edge fields, ordered. The richer EDGE_TYPES table (colors, force
// tuning) is built later for the graph; this bare list is all the early
// reverse-edge indexing needs, and keeps that indexing independent of graph code.
const EDGE_FIELDS = ["belongs_to", "requires", "relates", "provenance", "superseded_by"];
// human labels for each direction, reused by every connections surface
const EDGE_LABEL = {
  belongs_to: "belongs to", requires: "requires", relates: "relates",
  provenance: "provenance", superseded_by: "superseded by",
};
const EDGE_LABEL_IN = {
  requires: "required by", relates: "related from", provenance: "cited by",
  superseded_by: "supersedes",
};

// reverse edges, computed client-side
const requiredBy = new Map();   // id -> [ids that require it]
const children = new Map();      // index id -> [member ids that belong_to it]
DOCS.forEach(d => {
  edgeList(d, "requires").forEach(t => {
    if (!requiredBy.has(t)) requiredBy.set(t, []);
    requiredBy.get(t).push(d.id);
  });
  edgeList(d, "belongs_to").forEach(t => {
    if (!children.has(t)) children.set(t, []);
    children.get(t).push(d.id);
  });
});

function labelOf(id) {
  const d = byId.get(String(id));
  if (!d) return null;
  return d.label || d.title || d.id;
}

/* ===== STRUCTURAL SIGNPOSTS (the retired `index` type, re-derived) =====
   The `index` doc type is gone: a doc is a signpost STRUCTURALLY, by having
   descendants via belongs_to. We compute, once:
     - parentsOf(id)  : the belongs_to targets that actually resolve to a doc
     - descCount(id)  : transitive descendant count (size of the subtree below id)
     - isSignpost(id) : has at least one direct child (children map non-empty)
     - belongsRoots   : docs with no resolving belongs_to parent (topological roots)
   These replace every former `type === "index"` test in the viewer. */
function parentsOf(id) {
  const d = byId.get(String(id));
  if (!d) return [];
  return edgeList(d, "belongs_to").filter(p => byId.has(p));
}
function isSignpost(id) {
  const kids = children.get(String(id));
  return !!(kids && kids.length);
}
// transitive descendant count, memoized; cycle-guarded.
const _descCache = new Map();
function descCount(id) {
  const sid = String(id);
  if (_descCache.has(sid)) return _descCache.get(sid);
  const seen = new Set();
  (function walk(n) {
    (children.get(String(n)) || []).forEach(c => {
      if (!seen.has(c)) { seen.add(c); walk(c); }
    });
  })(sid);
  _descCache.set(sid, seen.size);
  return seen.size;
}
// belongs_to roots: docs that point at no resolving parent. These are the tops
// of the topology — entry-point candidates (the big ones) and orphans (the rest).
const belongsRoots = DOCS.filter(d => parentsOf(d.id).length === 0);

/* ===== EFFECTIVE SCOPE (client-side, no Python helper) =====
   `scope` is a string naming a topological zone (may also arrive as a 1-element
   list during migration — we normalize both). A doc's EFFECTIVE scope is the
   UNION of `scope` values along its belongs_to ancestor chain, including its own.
   Computed purely from the inlined docs. Memoized; cycle-guarded. If nothing
   resolves, returns [] and callers render nothing. */
function ownScopes(d) {
  const v = d && d.scope;
  if (v == null) return [];
  const arr = Array.isArray(v) ? v : [v];
  return arr.map(x => String(x).trim()).filter(Boolean);
}
const _scopeCache = new Map();
function effectiveScopes(id) {
  const sid = String(id);
  if (_scopeCache.has(sid)) return _scopeCache.get(sid);
  _scopeCache.set(sid, []); // cycle guard: a doc mid-walk contributes nothing yet
  const acc = new Set();
  const d = byId.get(sid);
  if (d) {
    ownScopes(d).forEach(s => acc.add(s));
    parentsOf(sid).forEach(p => effectiveScopes(p).forEach(s => acc.add(s)));
  }
  const out = [...acc].sort();
  _scopeCache.set(sid, out);
  return out;
}

/* stable color per scope name — hashed hue so distinct scopes read distinctly
   and the same scope is always the same color across every surface. */
const _scopeColorCache = new Map();
function scopeColor(name) {
  if (_scopeColorCache.has(name)) return _scopeColorCache.get(name);
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  const hue = h % 360;
  const c = { bg: `hsl(${hue} 52% 92%)`, fg: `hsl(${hue} 45% 32%)`, border: `hsl(${hue} 40% 78%)` };
  _scopeColorCache.set(name, c);
  return c;
}
// render a doc's effective scope as colored pill(s). Empty -> "" (renders nothing).
function scopePills(id, opts) {
  opts = opts || {};
  const scopes = effectiveScopes(id);
  if (!scopes.length) return "";
  const title = opts.title ? ` title="effective scope (own + inherited via belongs_to)"` : "";
  return scopes.map(s => {
    const c = scopeColor(s);
    return `<span class="scopepill" style="background:${c.bg};color:${c.fg};border-color:${c.border}"${title}>${escapeHtml(s)}</span>`;
  }).join("");
}

// who points AT this doc, by edge type (the reverse/incoming edges). Computed
// once up-front so every surface — backlinks lists, counts, tooltips — agrees.
// belongs_to-incoming is the index membership; it's surfaced separately as the
// member list, so backlink groups intentionally fold it under "members".
const incomingByType = new Map();   // id -> { edgeKey: [ids] }
DOCS.forEach(s => {
  EDGE_FIELDS.forEach(key => {
    edgeList(s, key).forEach(target => {
      let m = incomingByType.get(target);
      if (!m) { m = {}; incomingByType.set(target, m); }
      (m[key] = m[key] || []).push(String(s.id));
    });
  });
});
function incomingOf(id) { return incomingByType.get(String(id)) || {}; }

// total degree = distinct neighbors across every edge type, both directions.
// Used for the "this doc HAS connections" affordance (count badge).
function edgeCount(id) {
  const seen = new Set();
  const d = byId.get(String(id));
  if (d) EDGE_FIELDS.forEach(k => edgeList(d, k).forEach(o => { if (byId.has(o)) seen.add(o); }));
  const inc = incomingOf(id);
  Object.values(inc).forEach(arr => arr.forEach(o => seen.add(String(o))));
  return seen.size;
}
// small inline "N links" badge for previews/tooltips/expand surfaces
function edgeBadge(id) {
  const n = edgeCount(id);
  if (!n) return "";
  return `<span class="edgecount" title="${n} connection${n===1?"":"s"} — open to navigate">⇄ ${n}</span>`;
}

/* ===== edge-type model (shared by the neighborhood graph) =====
   Each forward edge field plus the two computed reverse edges. `dir` lets the
   graph draw a reverse edge with the correct orientation/label. Default force
   tuning per type: hierarchy tight, relates/provenance loose. */
const EDGE_TYPES = [
  { key: "belongs_to",     label: "belongs to",   color: "#5b6e8c", dir: "fwd", dist: 70,  strength: 0.9 },
  { key: "requires",       label: "requires",     color: "#b07a2a", dir: "fwd", dist: 95,  strength: 0.7 },
  { key: "relates",        label: "relates",      color: "#6a9a5b", dir: "fwd", dist: 140, strength: 0.35 },
  { key: "provenance",     label: "provenance",   color: "#9a7bb0", dir: "fwd", dist: 130, strength: 0.4 },
  { key: "superseded_by",  label: "superseded by",color: "#b03a3a", dir: "fwd", dist: 90,  strength: 0.7 },
];

/* ===== THE RESOLVER — one pass, used by every surface =====
   Renders raw markdown to HTML, with wiki-links and md-links resolved to labels.
   - [[id]]   -> <a> showing label, hover tooltip, click=expand, dblclick=navigate
   - ![[id]]  -> transclude body inline
   - [text](id.md) -> same resolved link (index "Map" bodies use this form)
   Unresolved ids render as visible broken links. */

function linkHtml(id, overrideText) {
  const sid = String(id);
  const d = byId.get(sid);
  if (!d) {
    return `<a class="dl broken" data-broken="1">${overrideText || sid}</a>`;
  }
  const text = overrideText || d.label || d.title || sid;
  return `<a class="dl" data-ref="${sid}" tabindex="0">${escapeHtml(text)}</a>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Pre-process markdown: replace link syntaxes with placeholder tokens, render md,
// then swap tokens for resolved anchors/transclusions. This keeps marked from
// mangling our custom links and lets transclusions become block elements.
function renderMarkdown(src, depth) {
  depth = depth || 0;
  if (src == null) return "";
  const tokens = [];
  let s = src;

  // ![[id]] transclusion
  s = s.replace(/!\[\[([0-9]+)\]\]/g, (_, id) => {
    const i = tokens.length;
    tokens.push({ kind: "trans", id });
    return `\n\nTOKEN${i}TOKEN\n\n`;
  });
  // [[id]] wiki-link
  s = s.replace(/\[\[([0-9]+)\]\]/g, (_, id) => {
    const i = tokens.length;
    tokens.push({ kind: "link", id });
    return `TOKEN${i}TOKEN`;
  });
  // [text](14digits.md) markdown link -> resolved link using the doc's label
  s = s.replace(/\[([^\]]*)\]\(([0-9]{6,})\.md\)/g, (_, text, id) => {
    const i = tokens.length;
    tokens.push({ kind: "link", id, text: byId.has(id) ? null : text }); // prefer canonical label
    return `TOKEN${i}TOKEN`;
  });

  let html = marked.parse(s);

  html = html.replace(/TOKEN(\d+)TOKEN/g, (_, n) => {
    const t = tokens[+n];
    if (!t) return "";
    if (t.kind === "link") return linkHtml(t.id, t.text || null);
    if (t.kind === "trans") {
      const d = byId.get(String(t.id));
      if (!d) return `<span class="dl broken">${t.id}</span>`;
      const inner = depth < 4 ? renderMarkdown(d.body, depth + 1) : "<em>(transclusion depth limit)</em>";
      return `<div class="transclude"><div class="th">transcluded · ${escapeHtml(d.label || d.id)}</div>${inner}</div>`;
    }
    return "";
  });
  return html;
}

/* ===== tooltip + link interactions (delegated) ===== */
const tooltip = document.getElementById("tooltip");
function showTip(el) {
  const id = el.getAttribute("data-ref");
  const d = byId.get(String(id));
  if (!d) return;
  const status = d.status ? `<span class="pill ${d.status}">${d.status}</span>` : "";
  // next-hop affordance: show how many connections this doc has so the reader
  // knows there's somewhere to go without opening it.
  const count = edgeBadge(d.id);
  const scopes = scopePills(d.id);
  tooltip.innerHTML =
    `<div class="tt-label">${escapeHtml(d.label || d.title || id)}</div>` +
    `<div class="tt-meta">${escapeHtml(d.type || "")} ${status} ${scopes} ${count}</div>` +
    `<div class="tt-sum">${escapeHtml(d.summary || "(no summary)")}</div>`;
  tooltip.style.display = "block";
}
function moveTip(e) {
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const r = tooltip.getBoundingClientRect();
  if (x + r.width > window.innerWidth) x = e.clientX - r.width - pad;
  if (y + r.height > window.innerHeight) y = e.clientY - r.height - pad;
  tooltip.style.left = x + "px"; tooltip.style.top = y + "px";
}
function hideTip() { tooltip.style.display = "none"; }

document.addEventListener("mouseover", e => {
  const a = e.target.closest("a.dl[data-ref]");
  if (a) showTip(a);
});
document.addEventListener("mousemove", e => {
  if (tooltip.style.display === "block") moveTip(e);
});
document.addEventListener("mouseout", e => {
  if (e.target.closest("a.dl[data-ref]")) hideTip();
});

// single click = expand in place (accordion); double click = navigate
let clickTimer = null;
document.addEventListener("click", e => {
  const a = e.target.closest("a.dl[data-ref]");
  if (!a) return;
  e.preventDefault();
  if (clickTimer) return; // wait to see if it becomes a dblclick
  clickTimer = setTimeout(() => {
    clickTimer = null;
    toggleExpand(a);
  }, 220);
});
document.addEventListener("dblclick", e => {
  const a = e.target.closest("a.dl[data-ref]");
  if (!a) return;
  e.preventDefault();
  if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
  hideTip();
  location.hash = "#/" + a.getAttribute("data-ref");
});

function toggleExpand(a) {
  hideTip();
  const id = a.getAttribute("data-ref");
  const d = byId.get(String(id));
  if (!d) return;
  // toggle: if next sibling is our expand block, remove it
  const nxt = a.nextElementSibling;
  if (nxt && nxt.classList && nxt.classList.contains("expand") && nxt.getAttribute("data-for") === id) {
    nxt.remove(); return;
  }
  const box = document.createElement("span");
  box.className = "expand"; box.setAttribute("data-for", id);
  box.style.display = "block";
  // member list for SIGNPOSTS (descendant-bearing docs) comes from belongs_to edges
  const sign = isSignpost(id);
  const memberPart = sign ? memberListHtml(id) : "";
  box.innerHTML = `<div class="eh">${escapeHtml(d.label || id)} · ${escapeHtml(d.type || "")} ${scopePills(id)} ${edgeBadge(id)} — single-click again to collapse, double-click to open in Reader</div>`
    + `<div class="md">${renderMarkdown(d.body, 1)}</div>`
    + memberPart
    + connectionsHtml(d, { skipChildren: sign });
  a.insertAdjacentElement("afterend", box);
}

/* ===== nav / routing ===== */
const pages = ["home", "reader", "catalog", "reviews"];
function activate(page) {
  pages.forEach(p => {
    document.getElementById("page-" + p).classList.toggle("active", p === page);
  });
  document.querySelectorAll("header.topnav nav button").forEach(b =>
    b.classList.toggle("active", b.getAttribute("data-page") === page));
}
document.querySelectorAll("header.topnav nav button").forEach(b => {
  b.addEventListener("click", () => {
    const p = b.getAttribute("data-page");
    if (p === "reader") location.hash = location.hash.startsWith("#/") ? location.hash : "#/reader";
    else location.hash = "#" + p;
  });
});

function route() {
  const h = location.hash || "#home";
  if (h.startsWith("#/")) {
    const id = h.slice(2);
    activate("reader");
    renderReader(id && byId.has(id) ? id : null);
  } else {
    const p = h.slice(1);
    activate(pages.includes(p) ? p : "home");
  }
}
window.addEventListener("hashchange", route);

/* ===== HOME / DASHBOARD ===== */
function renderHome() {
  const el = document.getElementById("page-home");
  const byType = {}, byStatus = {};
  DOCS.forEach(d => {
    byType[d.type || "?"] = (byType[d.type || "?"] || 0) + 1;
    byStatus[d.status || "?"] = (byStatus[d.status || "?"] || 0) + 1;
  });
  // Entry points are STRUCTURAL now (the `index` type is retired): a signpost is
  // a doc that bears descendants via belongs_to. Rank by transitive descendant
  // count so the biggest subtrees float to the top; the root component leads.
  const signposts = DOCS.filter(d => isSignpost(d.id))
    .sort((a, b) => descCount(b.id) - descCount(a.id) || String(labelOf(a.id)).localeCompare(String(labelOf(b.id))));
  // orphans = belongs_to roots that lead nowhere (no descendants, no parent) and
  // aren't themselves a signpost. These are the docs curation hasn't placed yet.
  const orphans = belongsRoots.filter(d => !isSignpost(d.id));
  const deprecated = DOCS.filter(d => d.status === "deprecated");
  const hot = DOCS.filter(d => Array.isArray(d.history) && d.history.length > 0)
    .sort((a, b) => (b.history.length) - (a.history.length)).slice(0, 8);

  const statBox = (n, l) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;

  let html = `<h1 class="pagetitle">Dashboard</h1><div class="sub">Orientation for the live_docs store — every link below resolves to a label; hover for summary, single-click to expand, double-click to open in Reader.</div>`;
  html += `<div class="stats">`;
  html += statBox(DOCS.length, "total docs");
  Object.keys(byType).sort().forEach(t => html += statBox(byType[t], t));
  html += `</div>`;
  html += `<div class="stats">`;
  Object.keys(byStatus).sort().forEach(s => html += statBox(byStatus[s], "status: " + s));
  html += `</div>`;

  // surface the root component prominently — the single doc whose subtree is the
  // whole store. (Largest signpost; falls out of the descendant-count ranking.)
  const root = signposts[0];
  if (root) {
    const rsum = byId.get(String(root.id));
    html += `<div class="card" style="border-left:3px solid var(--accent)">`
      + `<h3>The store root</h3>`
      + `<div style="font-size:15px;font-weight:600">${linkHtml(root.id)} ${scopePills(root.id, {title:1})} <span class="edgecount" title="docs in this subtree">⤵ ${descCount(root.id)} descendants</span></div>`
      + `<div class="sub" style="margin:4px 0 0">${escapeHtml((rsum && rsum.summary) || "")}</div></div>`;
  }

  html += `<div class="dash-cols">`;
  // entry points / signposts — descendant-bearing docs, ranked by subtree size.
  // (Replaces the old type:index list, of which there are now zero.)
  html += `<div class="card"><h3>Entry points — signposts (${signposts.length})</h3>`
    + `<div class="sub" style="margin:0 0 6px">Descendant-bearing docs, ranked by subtree size.</div><ul class="tight">`;
  signposts.forEach(d => {
    const sub = escapeHtml(d.summary || "");
    html += `<li>${linkHtml(d.id)} <span class="pill">${escapeHtml(d.type||"")}</span> ${scopePills(d.id)} <span class="edgecount" title="descendants in subtree">⤵ ${descCount(d.id)}</span>`
      + (sub ? `<div class="sub" style="margin:2px 0 0">${sub}</div>` : "") + `</li>`;
  });
  html += `</ul></div>`;

  // hot docs
  html += `<div class="card"><h3>Hot docs (most history entries)</h3><ul class="tight">`;
  hot.forEach(d => html += `<li>${linkHtml(d.id)} <span class="pill">${d.history.length} changes</span></li>`);
  html += `</ul></div>`;

  // orphans — belongs_to roots that bear no descendants (unplaced by curation)
  html += `<div class="card"><h3>Orphans — no belongs_to, no descendants (${orphans.length})</h3><ul class="tight">`;
  if (!orphans.length) html += `<li class="sub">none</li>`;
  orphans.forEach(d => html += `<li>${linkHtml(d.id)} <span class="pill">${escapeHtml(d.type||"")}</span> ${scopePills(d.id)}</li>`);
  html += `</ul></div>`;

  // deprecated -> superseded_by
  html += `<div class="card"><h3>Deprecated → superseded by (${deprecated.length})</h3><ul class="tight">`;
  if (!deprecated.length) html += `<li class="sub">none</li>`;
  deprecated.forEach(d => {
    const sup = edgeList(d, "superseded_by");
    const supHtml = sup.length ? sup.map(linkHtml).join(", ") : `<span class="dl broken">(no superseded_by!)</span>`;
    html += `<li>${linkHtml(d.id)} → ${supHtml}</li>`;
  });
  html += `</ul></div>`;
  html += `</div>`;
  el.innerHTML = html;
}

/* ===== READER ===== */
function buildTree() {
  // Folders are SIGNPOSTS (docs that bear descendants), not type:index — that
  // type is retired. A member that is itself a signpost nests as a sub-folder;
  // members with no descendants are leaves. Tree roots = signposts with no
  // resolving belongs_to parent.
  const roots = DOCS.filter(d => isSignpost(d.id) && parentsOf(d.id).length === 0)
    .sort((a, b) => descCount(b.id) - descCount(a.id));

  function renderNode(idx, seen) {
    seen = seen || new Set();
    if (seen.has(idx.id)) return ""; // guard cycles
    seen = new Set(seen); seen.add(idx.id);
    const memberIds = (children.get(idx.id) || []);
    const childSignposts = memberIds.filter(m => isSignpost(m)).map(m => byId.get(m)).filter(Boolean);
    const leaves = memberIds.filter(m => !isSignpost(m));
    let h = `<details open><summary data-ref="${idx.id}">${escapeHtml(idx.label || idx.title)}</summary>`;
    childSignposts.forEach(ci => h += renderNode(ci, seen));
    leaves.forEach(lid => {
      const d = byId.get(lid);
      if (!d) return;
      h += `<div class="leaf" data-id="${lid}">${escapeHtml(d.label || d.title || lid)}</div>`;
    });
    h += `</details>`;
    return h;
  }

  let h = "";
  roots.forEach(r => h += renderNode(r));

  // Ungrouped catch-all: docs that belong to nothing AND bear no descendants
  // (a signpost with no parent is already a root above, so exclude those).
  const ungrouped = belongsRoots.filter(d => !isSignpost(d.id));
  if (ungrouped.length) {
    h += `<details><summary>Ungrouped (${ungrouped.length})</summary>`;
    ungrouped.forEach(d => h += `<div class="leaf" data-id="${d.id}">${escapeHtml(d.label || d.title || d.id)}</div>`);
    h += `</details>`;
  }
  return h;
}

let readerTreeHtml = null;
function renderReader(focusId) {
  const el = document.getElementById("page-reader");
  if (readerTreeHtml === null) readerTreeHtml = buildTree();
  el.innerHTML = `<div class="reader"><div class="tree">${readerTreeHtml}</div><div class="content" id="reader-content"></div></div>`;

  // wire tree clicks
  el.querySelectorAll(".tree .leaf").forEach(n =>
    n.addEventListener("click", () => { location.hash = "#/" + n.getAttribute("data-id"); }));
  el.querySelectorAll(".tree summary[data-ref]").forEach(s =>
    s.addEventListener("dblclick", e => { e.preventDefault(); location.hash = "#/" + s.getAttribute("data-ref"); }));

  const content = document.getElementById("reader-content");
  if (!focusId) {
    content.innerHTML = `<h1 class="doctitle">Reader</h1><div class="sub">Pick a doc from the tree on the left, or double-click any link anywhere to focus it here.</div>`;
    return;
  }
  el.querySelectorAll(".tree .leaf").forEach(n =>
    n.classList.toggle("active", n.getAttribute("data-id") === focusId));
  renderFocusDoc(content, focusId);
}

function metaLine(d) {
  const bits = [];
  if (d.type) bits.push(d.type);
  if (d.status) bits.push(`<span class="pill ${d.status}">${d.status}</span>`);
  if (d.level) bits.push("level: " + d.level);
  if (d.created) bits.push("created " + String(d.created).slice(0, 10));
  bits.push(`<code>${d.id}</code>`);
  let line = bits.join(" · ");
  // effective-scope pills (own + inherited via belongs_to); nothing if unresolved
  const sp = scopePills(d.id, { title: 1 });
  if (sp) line += ` · <span class="scope-wrap">${sp}</span>`;
  return line;
}

function relGroup(title, ids) {
  if (!ids || !ids.length) return "";
  return `<div class="relgroup"><div class="rt">${escapeHtml(title)} (${ids.length})</div><ul>` +
    ids.map(id => `<li>${linkHtml(id)} ${edgeBadge(id)}</li>`).join("") + `</ul></div>`;
}

// Index member list, derived from the belongs_to reverse edge (children map) —
// the VIEWER is now the single source of this list; index bodies no longer carry
// a hand-written "## Map". Each member is a resolved label-link (hover tooltip),
// its one-line summary, a type pill, and an edge-count affordance.
function memberListHtml(indexId) {
  const members = children.get(String(indexId)) || [];
  if (!members.length) {
    return `<div class="members"><h2>Members</h2><div class="sub">No docs belong to this index yet.</div></div>`;
  }
  // sub-signposts first (descendant-bearing members), then the rest, alpha by label
  const sorted = members.slice().sort((a, b) => {
    const ia = isSignpost(a) ? 0 : 1, ib = isSignpost(b) ? 0 : 1;
    if (ia !== ib) return ia - ib;
    return String(labelOf(a) || a).localeCompare(String(labelOf(b) || b));
  });
  const li = sorted.map(mid => {
    const md = byId.get(mid);
    if (!md) return `<li>${linkHtml(mid)}</li>`;
    const pill = md.type ? `<span class="pill ${md.status||''}">${escapeHtml(md.type)}</span>` : "";
    const sum = md.summary ? `<span class="msum">— ${escapeHtml(md.summary)}</span>` : "";
    return `<li>${linkHtml(mid)} ${pill} ${scopePills(mid)} ${edgeBadge(mid)}${sum}</li>`;
  }).join("");
  return `<div class="members"><h2>Members (${members.length})</h2><ul>${li}</ul></div>`;
}

// The full two-column connections panel: OUTGOING (this doc's forward edges +
// derived children/required-by belong on the structural side) and INCOMING
// (everything that points back at this doc — the backlinks the user couldn't
// find). Every entry is a navigable resolved link with tooltip + edge badge.
function connectionsHtml(d, opts) {
  opts = opts || {};
  // outgoing: the forward edge fields, plus "children" (belongs_to-incoming) when
  // it's an index — but indexes render members separately, so skip children here.
  let out = "";
  out += relGroup("belongs to", edgeList(d, "belongs_to"));
  out += relGroup("requires", edgeList(d, "requires"));
  out += relGroup("relates", edgeList(d, "relates"));
  out += relGroup("provenance", edgeList(d, "provenance"));
  out += relGroup("superseded by", edgeList(d, "superseded_by"));
  if (!opts.skipChildren) out += relGroup("members (belongs_to →)", children.get(d.id));

  // incoming/backlinks: who points at this doc, grouped by edge type
  const inc = incomingOf(d.id);
  let back = "";
  back += relGroup("required by", inc.requires);
  back += relGroup("related from", inc.relates);
  back += relGroup("cited by (provenance)", inc.provenance);
  back += relGroup("supersedes", inc.superseded_by);
  // belongs_to-incoming = membership; only meaningful (and shown) for indexes,
  // where it's already the member list — so we omit it from backlinks to avoid dupes.

  const hasOut = out.trim(), hasBack = back.trim();
  if (!hasOut && !hasBack) return `<div class="rels"><h2>Connections</h2><div class="sub">No edges in or out.</div></div>`;
  return `<div class="rels"><h2>Connections</h2><div class="relcols">`
    + `<div class="relcol outgoing"><h3>Outgoing →</h3>${hasOut || '<div class="sub">none</div>'}</div>`
    + `<div class="relcol incoming"><h3>← Incoming (backlinks)</h3>${hasBack || '<div class="sub">none</div>'}</div>`
    + `</div></div>`;
}

// compact, collapsed-by-default change-trail for a doc
function historyTimeline(d) {
  const h = Array.isArray(d.history) ? d.history : [];
  if (!h.length) return "";
  const items = h.slice().sort((a, b) => String(a.at || "").localeCompare(String(b.at || "")))
    .map(e => {
      const when = escapeHtml(String(e.at || "").slice(0, 10));
      const what = renderMarkdown(String(e.summary || ""), 3);
      return `<li><div class="when">${when}</div><div class="what">${what}</div></li>`;
    }).join("");
  return `<details class="timeline"><summary>History — ${h.length} change${h.length === 1 ? "" : "s"}</summary><ol>${items}</ol></details>`;
}

function renderFocusDoc(content, id) {
  const d = byId.get(String(id));
  if (!d) { content.innerHTML = `<div class="sub">No doc with id ${escapeHtml(id)}.</div>`; return; }

  let html = `<h1 class="doctitle">${escapeHtml(d.label || d.title || id)}</h1>`;
  html += `<div class="meta-line">${metaLine(d)}</div>`;
  if (d.summary) html += `<div class="doc-summary">${escapeHtml(d.summary)}</div>`;

  if (isSignpost(d.id)) {
    // A SIGNPOST (descendant-bearing doc) shows its own body as the orientation
    // guide, then the member list rendered by the VIEWER from belongs_to reverse
    // edges (NOT from a "## Map" in the body). The `index` type is retired —
    // signpost-ness is purely structural now.
    html += `<div class="md" id="index-guide">${renderMarkdown(d.body)}</div>`;
    html += memberListHtml(d.id);
    html += `<div class="compose-btn"><button class="act" id="composeBtn">Expand — inline all member docs</button></div>`;
    html += `<div id="composed"></div>`;
    // a signpost still has its own edges (it belongs_to a parent, may require/relate)
    html += connectionsHtml(d, { skipChildren: true });
    content.innerHTML = html;
    const members = (children.get(d.id) || []);
    document.getElementById("composeBtn").addEventListener("click", function () {
      const target = document.getElementById("composed");
      if (target.innerHTML) { target.innerHTML = ""; this.textContent = "Expand — inline all member docs"; return; }
      let m = "";
      members.forEach(mid => {
        const md = byId.get(mid);
        if (!md) return;
        m += `<div class="member-sec"><h2 class="mtitle">${linkHtml(mid)} <span class="pill ${md.status||''}">${escapeHtml(md.type||'')}</span> ${scopePills(mid)} ${edgeBadge(mid)}</h2>`;
        m += `<div class="md">${renderMarkdown(md.body)}</div>`;
        m += connectionsHtml(md);   // backlinks/next-hops visible in compose too
        m += `</div>`;
      });
      target.innerHTML = m || `<div class="sub">No member docs.</div>`;
      this.textContent = "Collapse members";
    });
    // history + graph live below the connections panel
    content.insertAdjacentHTML("beforeend", historyTimeline(d) + graphPanelHtml());
    mountGraph(content, d.id);
    return;
  }

  // leaf doc: body + connections panel (outgoing + incoming backlinks)
  html += `<div class="md">${renderMarkdown(d.body)}</div>`;
  html += connectionsHtml(d);
  html += graphPanelHtml();
  html += historyTimeline(d);
  content.innerHTML = html;
  mountGraph(content, d.id);
}

/* ===== NEIGHBORHOOD GRAPH =====
   A deliberately lean, dependency-free 2-hop neighborhood view. Hand-rolled
   Verlet-ish force loop -> inline SVG. Nodes = focus + 1-hop + (capped) 2-hop
   across all edge types incl. computed reverse edges. Edges colored by type,
   per-type show/hide, per-type force tuning. Click node = refocus Reader+graph. */

const NODE_CAP = 40;            // hard cap on total nodes; 1-hop is always kept
// per-type toggle + live-tuned forces (persist within a session)
const graphPrefs = {};
EDGE_TYPES.forEach(t => graphPrefs[t.key] = { on: true, dist: t.dist, strength: t.strength });
// hop depth shared across the session — DEFAULT 1-hop (focus + direct neighbors).
// The user can opt into 2-hop via the control in the panel.
const graphView = { depth: 1 };

// all undirected edges touching a node, as {other, type, dir}. We expand across
// BOTH forward fields and their reverses so the neighborhood is symmetric.
function incidentEdges(id) {
  const out = [];
  const d = byId.get(String(id));
  if (!d) return out;
  EDGE_TYPES.forEach(t => {
    edgeList(d, t.key).forEach(o => { if (byId.has(o)) out.push({ other: o, type: t.key, from: id, to: o }); });
  });
  // reverse: who points at me via each forward field
  DOCS.forEach(s => {
    if (String(s.id) === String(id)) return;
    EDGE_TYPES.forEach(t => {
      if (edgeList(s, t.key).includes(String(id))) out.push({ other: s.id, type: t.key, from: s.id, to: id });
    });
  });
  return out;
}

// BFS to `depth` hops with capping. Returns {nodes:Set, edges:[], capped:bool}.
// depth defaults to 1: focus + its direct neighbors only (calm, readable).
function neighborhood(focus, depth) {
  depth = depth || 1;
  const dist = new Map([[String(focus), 0]]);
  const oneHop = [];
  incidentEdges(focus).forEach(e => { if (!dist.has(e.other)) { dist.set(e.other, 1); oneHop.push(e.other); } });
  let capped = false;
  // expand to 2-hop only when the user opts in (depth >= 2)
  if (depth >= 2) {
    for (const n of oneHop) {
      incidentEdges(n).forEach(e => {
        if (dist.has(e.other)) return;
        if (dist.size >= NODE_CAP) { capped = true; return; }
        dist.set(e.other, 2);
      });
    }
  }
  const nodes = new Set(dist.keys());
  // collect undirected edges among kept nodes, dedup by from|to|type
  const seen = new Set(), edges = [];
  nodes.forEach(n => incidentEdges(n).forEach(e => {
    if (!nodes.has(e.other)) return;
    const a = String(e.from), b = String(e.to);
    const k = a + "|" + b + "|" + e.type;
    const rk = b + "|" + a + "|" + e.type;
    if (seen.has(k) || seen.has(rk)) return;
    seen.add(k);
    edges.push({ source: a, target: b, type: e.type });
  }));
  return { nodes, edges, capped, dist };
}

function graphPanelHtml() {
  const toggles = EDGE_TYPES.map(t =>
    `<span class="gtoggle${graphPrefs[t.key].on ? "" : " off"}" data-etype="${t.key}">`
    + `<span class="swatch" style="background:${t.color}"></span>${t.label}</span>`).join("");
  const tune = EDGE_TYPES.map(t =>
    `<tr><td><span class="swatch" style="background:${t.color};width:14px;height:3px;display:inline-block;border-radius:2px"></span> ${t.label}</td>`
    + `<td>dist <input type="range" min="40" max="220" value="${graphPrefs[t.key].dist}" data-tune="dist" data-etype="${t.key}"></td>`
    + `<td>pull <input type="range" min="5" max="100" value="${Math.round(graphPrefs[t.key].strength*100)}" data-tune="strength" data-etype="${t.key}"></td></tr>`).join("");
  const hop = `<span class="ghop">depth `
    + `<label><input type="radio" name="ghop" value="1"${graphView.depth===1?" checked":""}> 1-hop</label>`
    + `<label><input type="radio" name="ghop" value="2"${graphView.depth===2?" checked":""}> 2-hop</label></span>`;
  return `<details class="ngraph"><summary>Neighborhood graph</summary><div class="gwrap">`
    + `<div class="gcap" data-cap hidden></div>`
    + `<div class="gcontrols">${hop}${toggles}</div>`
    + `<details class="gtune"><summary>force tuning</summary><table>${tune}</table></details>`
    + `<svg class="graph" data-graph></svg>`
    + `<div class="ghint">Drag nodes to rearrange · click a node to refocus · hover for summary.</div>`
    + `</div></details>`;
}

// mount + run the sim inside the panel just rendered into `container`
function mountGraph(container, focusId) {
  const panel = container.querySelector(".ngraph");
  if (!panel) return;
  const svg = panel.querySelector("svg[data-graph]");
  const capEl = panel.querySelector("[data-cap]");
  let sim = null;

  function build() {
    const nb = neighborhood(focusId, graphView.depth);
    if (nb.capped) { capEl.hidden = false; capEl.textContent = `Capped at ${NODE_CAP} nodes — 1-hop kept fully, 2-hop sampled. (Neighborhood is larger than shown.)`; }
    else capEl.hidden = true;

    const W = svg.clientWidth || 600, H = 420;
    const ids = [...nb.nodes];
    // seed positions on a circle around center (focus at center). A deterministic
    // angular jitter breaks exact symmetry so springs have a gradient to follow
    // without us re-randomizing every run.
    const nodes = ids.map((id, i) => {
      const isF = String(id) === String(focusId);
      const ang = (i / Math.max(1, ids.length)) * Math.PI * 2;
      const r = isF ? 0 : 120 + (nb.dist.get(id) === 2 ? 90 : 0);
      return { id, x: W/2 + Math.cos(ang)*r, y: H/2 + Math.sin(ang)*r + (isF?0:0.5), vx: 0, vy: 0, focus: isF, hop: nb.dist.get(id) };
    });
    const nmap = new Map(nodes.map(n => [n.id, n]));
    const edges = nb.edges.map(e => ({ ...e, s: nmap.get(e.source), t: nmap.get(e.target) }));
    return { W, H, nodes, edges, nmap };
  }

  let G = build();

  function activeEdges() { return G.edges.filter(e => graphPrefs[e.type].on); }

  // ---- simulated-annealing cooling ----
  // alpha is a global temperature in [0,1] that scales every displacement and
  // decays geometrically toward alphaMin. When it bottoms out the loop stops, so
  // motion smoothly damps to zero rather than oscillating forever. Repulsion and
  // spring constants are softened from the old values to avoid the "electrocuted"
  // thrash; clamped per-tick velocity prevents far-apart nodes from exploding.
  let alpha = 1;
  const alphaMin = 0.02, alphaDecay = 0.04, velMax = 8;
  const REPULSE = 1500;     // was 2600 — softer so the cloud doesn't blow apart
  const SPRING = 0.22;      // was 0.5 — gentler pull so it eases in, not snaps

  // one annealed force tick; returns mean displacement (for an optional settle check)
  function tick() {
    const { W, H, nodes } = G;
    const cx = W/2, cy = H/2;
    // mild centering (scaled by alpha)
    for (const n of nodes) {
      if (n.fixed || n.dragging) continue;
      n.vx += (cx - n.x) * 0.0016 * alpha;
      n.vy += (cy - n.y) * 0.0016 * alpha;
    }
    // pairwise repulsion (softened, alpha-scaled, with a min-distance floor)
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx*dx + dy*dy;
        if (d2 < 1) d2 = 1;
        const f = (REPULSE / d2) * alpha;
        const d = Math.sqrt(d2);
        const ux = dx/d, uy = dy/d;
        if (!a.fixed && !a.dragging) { a.vx += ux*f; a.vy += uy*f; }
        if (!b.fixed && !b.dragging) { b.vx -= ux*f; b.vy -= uy*f; }
      }
    }
    // springs along active edges, per-type distance/strength (alpha-scaled)
    for (const e of activeEdges()) {
      const p = graphPrefs[e.type];
      const a = e.s, b = e.t;
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 0.01;
      const diff = (d - p.dist) / d * p.strength * SPRING * alpha;
      const ox = dx*diff, oy = dy*diff;
      if (!a.fixed && !a.dragging) { a.vx += ox; a.vy += oy; }
      if (!b.fixed && !b.dragging) { b.vx -= ox; b.vy -= oy; }
    }
    // focus node anchored to center
    const fn = G.nodes.find(n => n.focus);
    if (fn && !fn.dragging) { fn.x = cx; fn.y = cy; fn.vx = fn.vy = 0; }
    let disp = 0;
    for (const n of nodes) {
      if (n.fixed || n.dragging || n.focus) continue;
      n.vx *= 0.75; n.vy *= 0.75;                 // stronger friction = calmer
      // clamp per-tick step so nothing whips across the canvas
      let mv = Math.sqrt(n.vx*n.vx + n.vy*n.vy);
      if (mv > velMax) { n.vx *= velMax/mv; n.vy *= velMax/mv; }
      n.x += n.vx; n.y += n.vy;
      n.x = Math.max(16, Math.min(W-16, n.x));
      n.y = Math.max(16, Math.min(H-16, n.y));
      disp += Math.abs(n.vx) + Math.abs(n.vy);
    }
    return disp / Math.max(1, nodes.length);
  }

  function draw() {
    const ns = "http://www.w3.org/2000/svg";
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const colorOf = {}; EDGE_TYPES.forEach(t => colorOf[t.key] = t.color);
    const ge = document.createElementNS(ns, "g");
    activeEdges().forEach(e => {
      const ln = document.createElementNS(ns, "line");
      ln.setAttribute("class", "gedge");
      ln.setAttribute("x1", e.s.x); ln.setAttribute("y1", e.s.y);
      ln.setAttribute("x2", e.t.x); ln.setAttribute("y2", e.t.y);
      ln.setAttribute("stroke", colorOf[e.type]);
      ln.setAttribute("stroke-width", e.type === "belongs_to" ? 2 : 1.4);
      if (e.type === "relates" || e.type === "provenance") ln.setAttribute("stroke-dasharray", "4 3");
      ge.appendChild(ln);
    });
    svg.appendChild(ge);
    G.nodes.forEach(n => {
      const d = byId.get(n.id);
      const g = document.createElementNS(ns, "g");
      g.setAttribute("class", "gnode" + (n.focus ? " focus" : ""));
      g.setAttribute("transform", `translate(${n.x},${n.y})`);
      g.setAttribute("data-nid", n.id);
      const c = document.createElementNS(ns, "circle");
      c.setAttribute("r", n.focus ? 9 : (n.hop === 1 ? 6.5 : 5));
      c.setAttribute("fill", n.focus ? "#2b2b2b" : (isSignpost(n.id) ? "#5b6e8c" : "#a9b4c6"));
      g.appendChild(c);
      const t = document.createElementNS(ns, "text");
      t.setAttribute("x", (n.focus ? 12 : 9)); t.setAttribute("y", 3.5);
      let lbl = (d && (d.label || d.title || d.id)) || n.id;
      if (lbl.length > 26) lbl = lbl.slice(0, 25) + "…";
      t.textContent = lbl;
      g.appendChild(t);
      svg.appendChild(g);
    });
  }

  let raf = null;
  // animate: each frame ticks once, cools alpha, repaints; stops when cold so the
  // layout settles and STAYS settled (no perpetual jitter, no re-randomize).
  function loop() {
    tick();
    draw();
    alpha = Math.max(alphaMin, alpha - alpha * alphaDecay);
    if (alpha > alphaMin) raf = requestAnimationFrame(loop);
    else { raf = null; alpha = alphaMin; tick(); draw(); }  // one final cold settle
  }
  // Pre-warm: run a batch of iterations BEFORE the first paint so the panel opens
  // already roughly laid out, then the animated loop only gently settles it.
  function prewarm(iters) {
    const savedAlpha = alpha;
    alpha = 1;
    for (let i = 0; i < iters; i++) { tick(); alpha = Math.max(0.25, alpha - alpha * alphaDecay); }
    alpha = savedAlpha;
  }
  // Full (re)start: rebuild graph from scratch + reheat. Used only when the node
  // SET changes (depth toggle / panel first-open) — never on mere interaction.
  function start() {
    if (raf) cancelAnimationFrame(raf);
    G = build();
    prewarm(80);     // settle most of the way off-screen
    alpha = 0.45;    // open warm-ish, then ease the rest of the way down
    loop();
  }
  // Gentle reheat: keep current positions, just nudge the temperature back up so
  // the existing layout adapts to a toggle/tuning change without re-randomizing.
  function reheat(a) {
    alpha = Math.max(alpha, a || 0.3);
    if (!raf) loop();
  }

  // only run while the panel is open (cheap when collapsed)
  panel.addEventListener("toggle", () => {
    if (panel.open) start();
    else if (raf) { cancelAnimationFrame(raf); raf = null; }
  });

  // hop-depth control: changes the node SET, so a full restart is warranted
  panel.querySelectorAll('input[name="ghop"]').forEach(el => el.addEventListener("change", () => {
    graphView.depth = +el.value;
    start();
  }));
  // edge-type toggles — same node set, just reheat so it adapts smoothly
  panel.querySelectorAll(".gtoggle").forEach(el => el.addEventListener("click", () => {
    const k = el.getAttribute("data-etype");
    graphPrefs[k].on = !graphPrefs[k].on;
    el.classList.toggle("off", !graphPrefs[k].on);
    reheat(0.3);
  }));
  // force tuning sliders — reheat, don't rebuild
  panel.querySelectorAll("input[data-tune]").forEach(el => el.addEventListener("input", () => {
    const k = el.getAttribute("data-etype"), which = el.getAttribute("data-tune");
    if (which === "dist") graphPrefs[k].dist = +el.value;
    else graphPrefs[k].strength = +el.value / 100;
    reheat(0.25);
  }));

  // pointer: drag to move, click (no drag) to refocus, hover reuses tooltip
  let drag = null, moved = false;
  function svgPoint(ev) {
    const r = svg.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (G.W / r.width), y: (ev.clientY - r.top) * (G.H / r.height) };
  }
  svg.addEventListener("mousedown", ev => {
    const g = ev.target.closest(".gnode"); if (!g) return;
    const n = G.nmap.get(g.getAttribute("data-nid")); if (!n) return;
    drag = n; moved = false; n.dragging = true; svg.style.cursor = "grabbing";
    ev.preventDefault();
  });
  window.addEventListener("mousemove", ev => {
    if (!drag) return;
    const p = svgPoint(ev); drag.x = p.x; drag.y = p.y; drag.vx = drag.vy = 0; moved = true;
    // gently let neighbors relax around the dragged node — no rebuild, no re-seed
    reheat(0.18);
  });
  window.addEventListener("mouseup", () => {
    if (drag) { drag.dragging = false; drag = null; svg.style.cursor = "grab"; reheat(0.12); }
  });
  // tooltip reuse: synthesize a data-ref carrier on hover over a node
  svg.addEventListener("mousemove", ev => {
    const g = ev.target.closest(".gnode");
    if (g && !drag) { const fake = { getAttribute: a => a === "data-ref" ? g.getAttribute("data-nid") : null }; showTip(fake); moveTip(ev); }
    else if (!drag) hideTip();
  });
  svg.addEventListener("mouseleave", hideTip);
  // click = refocus (only if it wasn't a drag)
  svg.addEventListener("click", ev => {
    const g = ev.target.closest(".gnode"); if (!g || moved) return;
    hideTip();
    location.hash = "#/" + g.getAttribute("data-nid");
  });

  if (panel.open) start();
}

/* ===== CATALOG ===== */
const catalogState = { type: "", status: "", level: "", scope: "", q: "", group: "", sort: "label", dir: 1 };
function renderCatalog() {
  const el = document.getElementById("page-catalog");
  const types = [...new Set(DOCS.map(d => d.type).filter(Boolean))].sort();
  const statuses = [...new Set(DOCS.map(d => d.status).filter(Boolean))].sort();
  const levels = [...new Set(DOCS.map(d => d.level).filter(Boolean))].sort();
  // effective-scope facet: the union of every doc's resolved scope set (computed
  // client-side along belongs_to). This is the axis the Catalog was missing.
  const scopes = [...new Set(DOCS.flatMap(d => effectiveScopes(d.id)))].sort();
  const opt = (arr, sel) => `<option value="">all</option>` + arr.map(v => `<option ${v===sel?"selected":""}>${v}</option>`).join("");

  let html = `<h1 class="pagetitle">Catalog</h1><div class="sub">Every doc as a row. Filter, group, and sort — the "query like rows" view.</div>`;
  html += `<div class="catalog-tools">`;
  html += `<span class="preset" data-preset="decisions">Decisions</span>`;
  html += `<span class="preset" data-preset="principles">Principles</span>`;
  html += `<span class="preset" data-preset="living">Living</span>`;
  html += `<span class="preset" data-preset="clear">Clear</span>`;
  html += `&nbsp; type <select id="f-type">${opt(types, catalogState.type)}</select>`;
  html += ` status <select id="f-status">${opt(statuses, catalogState.status)}</select>`;
  html += ` level <select id="f-level">${opt(levels, catalogState.level)}</select>`;
  if (scopes.length) html += ` scope <select id="f-scope">${opt(scopes, catalogState.scope)}</select>`;
  html += ` group by <select id="f-group"><option value="">none</option>`
    + ["type","status","level"].concat(scopes.length ? ["scope"] : [])
        .map(g => `<option ${g===catalogState.group?"selected":""}>${g}</option>`).join("") + `</select>`;
  html += ` <input id="f-q" placeholder="search label/title…" value="${escapeHtml(catalogState.q)}">`;
  html += `</div>`;
  html += `<div class="count-note" id="cat-count"></div>`;
  html += `<table class="catalog"><thead><tr>`;
  ["label","title","type","status","level"].forEach(c =>
    html += `<th data-sort="${c}">${c}${catalogState.sort===c?(catalogState.dir>0?" ▲":" ▼"):""}</th>`);
  html += `<th>scope</th>`;  // effective scope — computed, so not click-sortable
  html += `<th data-sort="created">created${catalogState.sort==="created"?(catalogState.dir>0?" ▲":" ▼"):""}</th>`;
  html += `</tr></thead><tbody id="cat-body"></tbody></table>`;
  el.innerHTML = html;

  const draw = () => {
    let rows = DOCS.filter(d =>
      (!catalogState.type || d.type === catalogState.type) &&
      (!catalogState.status || d.status === catalogState.status) &&
      (!catalogState.level || d.level === catalogState.level) &&
      (!catalogState.scope || effectiveScopes(d.id).includes(catalogState.scope)) &&
      (!catalogState.q || ((d.label||"")+" "+(d.title||"")).toLowerCase().includes(catalogState.q.toLowerCase())));
    const s = catalogState.sort;
    rows.sort((a,b) => String(a[s]||"").localeCompare(String(b[s]||"")) * catalogState.dir);
    document.getElementById("cat-count").textContent = `${rows.length} of ${DOCS.length} docs`;
    const body = document.getElementById("cat-body");
    const cell = d => `<td>${linkHtml(d.id)}</td><td>${escapeHtml(d.title||"")}</td><td>${escapeHtml(d.type||"")}</td>`
      + `<td><span class="pill ${d.status||''}">${escapeHtml(d.status||"")}</span></td><td>${escapeHtml(d.level||"")}</td>`
      + `<td>${scopePills(d.id, { title: 1 }) || '<span class="sub">—</span>'}</td>`
      + `<td>${escapeHtml(String(d.created||"").slice(0,10))}</td>`;
    if (catalogState.group) {
      // grouping by effective scope is multi-valued: a doc lands in every zone it
      // resolves to (and "(none)" if it resolves to none). Other axes are single.
      const groups = {};
      const push = (k, d) => { (groups[k]=groups[k]||[]).push(d); };
      rows.forEach(d => {
        if (catalogState.group === "scope") {
          const es = effectiveScopes(d.id);
          if (!es.length) push("(none)", d); else es.forEach(z => push(z, d));
        } else push(d[catalogState.group]||"(none)", d);
      });
      body.innerHTML = Object.keys(groups).sort().map(k =>
        `<tr class="grouphdr"><td colspan="7">${escapeHtml(catalogState.group)}: ${escapeHtml(k)} (${groups[k].length})</td></tr>`
        + groups[k].map(d => `<tr>${cell(d)}</tr>`).join("")).join("");
    } else {
      body.innerHTML = rows.map(d => `<tr>${cell(d)}</tr>`).join("");
    }
  };

  el.querySelector("#f-type").addEventListener("change", e => { catalogState.type = e.target.value; draw(); });
  el.querySelector("#f-status").addEventListener("change", e => { catalogState.status = e.target.value; draw(); });
  el.querySelector("#f-level").addEventListener("change", e => { catalogState.level = e.target.value; draw(); });
  const scopeSel = el.querySelector("#f-scope");
  if (scopeSel) scopeSel.addEventListener("change", e => { catalogState.scope = e.target.value; draw(); });
  el.querySelector("#f-group").addEventListener("change", e => { catalogState.group = e.target.value; draw(); });
  el.querySelector("#f-q").addEventListener("input", e => { catalogState.q = e.target.value; draw(); });
  el.querySelectorAll("th[data-sort]").forEach(th => th.addEventListener("click", () => {
    const c = th.getAttribute("data-sort");
    if (catalogState.sort === c) catalogState.dir *= -1; else { catalogState.sort = c; catalogState.dir = 1; }
    renderCatalog();
  }));
  el.querySelectorAll(".preset").forEach(p => p.addEventListener("click", () => {
    const k = p.getAttribute("data-preset");
    Object.assign(catalogState, { type: "", status: "", level: "", scope: "", q: "", group: "" });
    if (k === "decisions") catalogState.type = "decision";
    else if (k === "principles") catalogState.type = "principle";
    else if (k === "living") catalogState.status = "living";
    renderCatalog();
  }));
  draw();
}

/* ===== REVIEWS =====
   Collapsed card: change-size (count of touched docs) + timestamp + signoffs as
   readable badges. Expanded card: the body's change summary (resolver active),
   with the sign-off CLI snippet living INSIDE the summary (you sign after reading). */
function signoffBadges(r) {
  const sigs = Array.isArray(r.signoffs) ? r.signoffs : [];
  if (!sigs.length) return `<span class="badge unsigned">unsigned</span>`;
  return sigs.map(s => {
    const who = escapeHtml(String(s.who || s.by || "signed").replace(/@.*$/, ""));
    const at = s.at ? `<span class="sig-at">${escapeHtml(String(s.at).slice(0,10))}</span>` : "";
    return `<span class="sig">${who} ${at}</span>`;
  }).join(" ");
}

function renderReviews() {
  const el = document.getElementById("page-reviews");
  const revs = REVIEWS.slice().sort((a,b) => String(b.id).localeCompare(String(a.id))); // newest first
  let html = `<h1 class="pagetitle">Reviews</h1><div class="sub">The review queue, newest first. Click a card to read the change summary; the sign-off command lives there. The viewer never writes — run the command in a terminal.</div>`;
  if (!revs.length) html += `<div class="sub" style="margin-left:24px">No reviews.</div>`;
  html += `<div style="margin:0 24px 40px">`;
  revs.forEach(r => {
    const signed = Array.isArray(r.signoffs) && r.signoffs.length > 0;
    const n = (r.touched || []).length;
    const cmd = `ldoc review sign ${r.id}`;
    html += `<div class="card rev-card ${signed?"signed":"unsigned"}" data-rid="${escapeHtml(String(r.id))}">`;
    // collapsed head: size signal + when + signoff badges
    html += `<div class="rev-head">`
      + `<span class="rev-toggle">▸</span>`
      + `<span class="rev-size">${n} <small>doc${n===1?"":"s"} touched</small></span>`
      + `<span class="rev-when">${escapeHtml(String(r.created||"").slice(0,10))}</span>`
      + `<span class="spacer"></span>`
      + `${signoffBadges(r)}</div>`;
    // expanded body: change summary + sign snippet
    html += `<div class="rev-body">`;
    html += r.body ? `<div class="md">${renderMarkdown(r.body)}</div>` : `<div class="sub">No change summary recorded.</div>`;
    html += `<div class="snippet" style="margin-top:14px"><code>${escapeHtml(cmd)}</code>`
      + `<button class="copybtn" data-cmd="${escapeHtml(cmd)}">copy sign-off command</button></div>`;
    html += `</div></div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
  el.querySelectorAll(".rev-head").forEach(h => h.addEventListener("click", () => {
    const card = h.closest(".rev-card");
    const open = card.classList.toggle("open");
    h.querySelector(".rev-toggle").textContent = open ? "▾" : "▸";
  }));
  el.querySelectorAll(".copybtn").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const cmd = b.getAttribute("data-cmd");
    navigator.clipboard?.writeText(cmd).then(() => { b.textContent = "copied!"; setTimeout(() => b.textContent = "copy sign-off command", 1200); })
      .catch(() => { b.textContent = "copy failed"; });
  }));
}

/* ===== boot ===== */
renderHome();
renderCatalog();
renderReviews();
route();
</script>
</body>
</html>
